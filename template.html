<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<title>Lisen Varemodtagelse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300..600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#fcf7f8; --panel:#ffffff; --panel2:#faf2f4; --ink:#3b2d34; --ink2:#6e5b64; --ink3:#9d8a93;
  --line:#efe0e5; --line2:#f5ecef;
  --accent:#b25c80; --accent-soft:#f9e8ef; --accent-ink:#ffffff; --link:#a24f73;
  --tape:#fbe4d6; --tape-ink:#6f3a22; --tape-line:#f3cdb7;
  --late:#b4475f; --late-bg:#fbe8ec; --today:#3f7d63; --today-bg:#e4f2eb; --tom:#98691f; --tom-bg:#fbf0dc; --later-bg:#f4edf0;
  --shadow:0 1px 2px rgba(110,60,80,.04),0 6px 22px rgba(110,60,80,.06);
  --flyt:#8b64b9; --flyt-bg:#f3edf9; --butik:#4f8a70; --butik-bg:#e8f3ed;
  --serie1:#8b64b9; --serie2:#98691f;
  --radius:14px; --radius-s:9px;
  --sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1519; --panel:#241c21; --panel2:#2b2227; --ink:#f4e9ee; --ink2:#c8b5bd; --ink3:#95808a;
  --line:#3a2d34; --line2:#30262b; --accent:#e59aba; --accent-soft:#3a2530; --accent-ink:#2a1520; --link:#eea7c5;
  --tape:#43302a; --tape-ink:#f6d5c3; --tape-line:#5a4036;
  --late:#f0899f; --late-bg:#3c2229; --today:#8fd0b1; --today-bg:#1e3229; --tom:#efc27c; --tom-bg:#382c18; --later-bg:#2b2227;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 22px rgba(0,0,0,.2);
  --flyt:#c5a7ec; --flyt-bg:#2e2540; --butik:#8fd0b1; --butik-bg:#1e3229;
  --serie1:#8f66c9; --serie2:#b8862e;
}}
:root[data-theme="dark"]{
  --bg:#1b1519; --panel:#241c21; --panel2:#2b2227; --ink:#f4e9ee; --ink2:#c8b5bd; --ink3:#95808a;
  --line:#3a2d34; --line2:#30262b; --accent:#e59aba; --accent-soft:#3a2530; --accent-ink:#2a1520; --link:#eea7c5;
  --tape:#43302a; --tape-ink:#f6d5c3; --tape-line:#5a4036;
  --late:#f0899f; --late-bg:#3c2229; --today:#8fd0b1; --today-bg:#1e3229; --tom:#efc27c; --tom-bg:#382c18; --later-bg:#2b2227;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 22px rgba(0,0,0,.2);
  --flyt:#c5a7ec; --flyt-bg:#2e2540; --butik:#8fd0b1; --butik-bg:#1e3229;
  --serie1:#8f66c9; --serie2:#b8862e;
}
*{box-sizing:border-box}
html{color-scheme:light dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;font-weight:400;line-height:1.5;margin:0;padding-inline:16px;padding-block:0 56px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto}
a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
b,strong{font-weight:600}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:34px 22px}
h1{font-weight:300;font-size:clamp(30px,5vw,44px);line-height:1;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
h1 small{display:block;font-size:12px;font-weight:500;letter-spacing:.22em;color:var(--accent);margin-bottom:10px}
.fresh{font-size:13px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
.fresh b{color:var(--accent);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:3px;position:relative;box-shadow:var(--shadow);transition:border-color .15s}
.stat:hover{border-color:var(--accent)}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),var(--shadow)}
.stat .lbl{font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.stat .lbl i{width:7px;height:7px;border-radius:50%;display:inline-block}
.stat .big{font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-.01em}
.stat .sub{font-size:13px;color:var(--ink2)}
.stat .sub b{color:var(--ink);font-weight:500}
.s-late .lbl{color:var(--late)} .s-late .lbl i{background:var(--late)}
.s-today .lbl{color:var(--today)} .s-today .lbl i{background:var(--today)}
.s-tom .lbl{color:var(--tom)} .s-tom .lbl i{background:var(--tom)}
.s-later .lbl{color:var(--ink2)} .s-later .lbl i{background:var(--ink3)}

.presell-band{display:flex;flex-wrap:wrap;gap:8px 30px;align-items:center;background:var(--tape);color:var(--tape-ink);border:1px solid var(--tape-line);border-radius:var(--radius);padding:12px 18px;margin-bottom:12px}
.presell-band div{display:flex;align-items:baseline;gap:7px}
.presell-band b{font-weight:500;font-size:22px}
.presell-band span{font-size:13.5px}
.presell-band .tag{font-weight:500;letter-spacing:.18em;font-size:11.5px;text-transform:uppercase}
.flyt-band{display:flex;flex-wrap:wrap;gap:8px 30px;align-items:center;width:100%;text-align:left;font:inherit;cursor:pointer;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:12px 18px;margin:0 0 12px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:border-color .15s}
.flyt-band::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--flyt)}
.flyt-band:hover{border-color:var(--flyt)}
.flyt-band div{display:flex;align-items:baseline;gap:7px}
.flyt-band b{font-weight:500;font-size:22px}
.flyt-band span{font-size:13.5px;color:var(--ink2)}
.flyt-band .tag{font-weight:500;letter-spacing:.18em;font-size:11.5px;text-transform:uppercase;color:var(--flyt)}
.flyt-band .gaa{margin-left:auto;font-weight:500;font-size:13.5px;color:var(--link)}
.flyt-band.butik-band::before{background:var(--butik)}
.flyt-band.butik-band:hover{border-color:var(--butik)}
.flyt-band.butik-band .tag{color:var(--butik)}
.flyt-band.butik-band{margin-bottom:26px}
.butik-vis .flyt-sum .hoved b,.butik-vis .flytantal b{color:var(--butik)}
.butik-vis .hylde{background:var(--butik-bg)}
.flytantal small{font-size:12px;color:var(--ink2);margin-top:4px;white-space:nowrap}
.flyt-sum{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.flyt-sum div{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;display:flex;flex-direction:column;min-width:150px;flex:1 1 150px;box-shadow:var(--shadow)}
.flyt-sum b{font-weight:400;font-size:28px;line-height:1.15}
.flyt-sum span{font-size:13px;color:var(--ink2)}
.flyt-sum .hoved b{color:var(--flyt)}
.flytliste{display:flex;flex-direction:column;gap:10px}
.flytvare{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:16px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 18px 12px 12px;box-shadow:var(--shadow)}
.flytvare img,.flytvare .noimg{width:84px;height:104px;object-fit:cover;border-radius:var(--radius-s);background:var(--panel2);display:block}
.flytvare .noimg{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink3);text-align:center}
.flytvare h3{margin:2px 0 0;font-size:16px;font-weight:500;letter-spacing:.01em}
.flytvare h3 small{font-weight:400;color:var(--ink2)}
.flytvare .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink2);margin-top:3px}
.hylder{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.hylde{font-family:var(--mono);font-size:11.5px;background:var(--flyt-bg);color:var(--ink);border-radius:99px;padding:2px 9px;white-space:nowrap}
details.lok{margin-top:8px}
details.lok>summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;list-style:none;font-size:12.5px;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;background:var(--panel2);user-select:none}
details.lok>summary::-webkit-details-marker{display:none}
details.lok>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details.lok[open]>summary::before{transform:rotate(45deg)}
details.lok>summary:hover{border-color:var(--flyt);color:var(--ink)}
details.lok .hylder{margin-top:6px}
.flytordrer{font-size:13px;margin-top:8px;color:var(--ink2);line-height:1.8;overflow-wrap:anywhere}
.flytordrer a{margin-right:8px;white-space:nowrap}
.flytantal{text-align:right;display:flex;flex-direction:column;align-items:flex-end;padding-top:2px}
.flytantal b{font-weight:400;font-size:30px;line-height:1;color:var(--flyt)}
.flytantal span{font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.strl{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.strl span{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;background:var(--panel);white-space:nowrap;color:var(--ink2)}
.strl span b{font-weight:600;color:var(--ink)}
.strl span.i-ordre{border-color:var(--flyt);background:var(--flyt-bg)}
.filter-knap{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:99px;padding:5px 13px;cursor:pointer;transition:border-color .15s}
.filter-knap:hover{border-color:var(--accent);color:var(--ink)}
.filter-knap[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.knaprad{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
@media (max-width:560px){.flytvare{grid-template-columns:64px minmax(0,1fr);gap:12px}.flytvare img,.flytvare .noimg{width:64px;height:80px}.flytantal{grid-column:2;flex-direction:row;gap:8px;align-items:baseline}}

nav.hoved{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
nav.hoved button{font:inherit;font-size:12.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:9px 17px;cursor:pointer;display:inline-flex;align-items:center;gap:9px;white-space:nowrap;box-shadow:var(--shadow);transition:border-color .15s,background .15s,color .15s}
nav.hoved button:hover{border-color:var(--accent);color:var(--ink)}
nav.hoved button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.hoved button .c{font-family:var(--mono);font-size:11.5px;letter-spacing:0;opacity:.75}
nav.tabs[hidden]{display:none}
@media (max-width:640px){nav.hoved{gap:6px}nav.hoved button{padding:8px 13px;font-size:11.5px;letter-spacing:.1em}}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs button{font:inherit;font-weight:400;font-size:14.5px;background:none;border:0;padding:7px 14px;color:var(--ink2);cursor:pointer;border-radius:99px;white-space:nowrap;transition:background .15s,color .15s}
nav.tabs button:hover{background:var(--panel2);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
nav.tabs button .c{font-family:var(--mono);font-size:11.5px;opacity:.7;margin-left:6px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1 1 260px;min-width:0;font:inherit;padding:10px 16px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.tools input[type=search]::placeholder{color:var(--ink3)}
.chip{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink2);padding:5px 13px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.hint{font-size:13.5px;color:var(--ink3);margin:-2px 0 14px;max-width:95ch}

/* PO-kort */
.polist{display:flex;flex-direction:column;gap:10px}
.po{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.po>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px 14px 0}
.po>summary::-webkit-details-marker{display:none}
.rank{align-self:stretch;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;color:var(--ink3);border-right:1px solid var(--line2)}
.po.har-ordrer .rank{background:var(--tape);color:var(--tape-ink);border-right:0}
.po-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 10px;min-width:0}
.po-h .lev{font-weight:500;font-size:17px;letter-spacing:.01em}
.po-h .ref{font-family:var(--mono);font-size:12.5px;color:var(--ink2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.po-h .id{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.po-note{flex-basis:100%;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap}
.b-late{background:var(--late-bg);color:var(--late)} .b-today{background:var(--today-bg);color:var(--today)}
.b-tom{background:var(--tom-bg);color:var(--tom)} .b-later{background:var(--later-bg);color:var(--ink2)}
.b-ps{background:var(--tape);color:var(--tape-ink)}
.b-wait{background:var(--panel2);color:var(--ink3)}
.figs{display:flex;gap:20px;text-align:right}
.fig{display:flex;flex-direction:column;min-width:56px}
.fig b{font-weight:400;font-size:24px;line-height:1.1}
.fig span{font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.fig.ord b{color:var(--accent)}
.fig.zero b{color:var(--ink3)}
.po-body{border-top:1px solid var(--line2);padding:16px 18px 18px 74px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px}
.po-body h4{margin:0 0 8px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.po-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13.5px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:500;padding:7px 16px;border-radius:99px;font-size:13.5px}
.btn:hover{filter:brightness(1.05)}
.po-fullnote{grid-column:1/-1;white-space:pre-wrap;font-size:13.5px;background:var(--panel2);border-radius:var(--radius-s);padding:10px 14px;margin:0}
.scroll{overflow-x:auto;max-height:440px;overflow-y:auto;border:1px solid var(--line2);border-radius:var(--radius-s);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;z-index:1;background:var(--panel2);text-align:left;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.r,th.r{text-align:right}
tr.vent td{background:color-mix(in srgb,var(--tape) 45%,transparent)}
td.thumb{width:48px;padding-right:0}
.tn{width:38px;height:48px;object-fit:cover;border-radius:6px;background:var(--panel2);display:block}
.tn.tom{display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--ink3)}
.vare-celle{display:flex;align-items:center;gap:10px;min-width:180px}
.sku{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.age{font-family:var(--mono);font-size:12px}
.age.gl{color:var(--late)}
.smalltag{font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);margin-left:5px;white-space:nowrap}
.udenvarer{display:flex;flex-direction:column;gap:6px;min-width:240px}

/* Alle PO'er */
.po-tbl{min-width:1080px}
.po-tbl td{vertical-align:middle}
.po-tbl .lev-celle{display:flex;align-items:center;gap:10px;min-width:220px}
.po-tbl .lev-navn{font-weight:500;font-size:14.5px}
.po-tbl .brands{font-size:12px;color:var(--ink2);max-width:260px}
.po-tbl .po-id{font-family:var(--mono);font-size:11.5px;color:var(--ink3);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.po-tbl td.num{white-space:nowrap}
.po-tbl .po-id a{color:inherit}
.po-tbl tr.kladde td{background:color-mix(in srgb,var(--panel2) 70%,transparent)}
.po-tbl tr.aendret td{background:color-mix(in srgb,var(--today-bg) 70%,transparent)}
.po-tbl .note{font-size:12.5px;color:var(--ink2);max-width:220px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fremdrift{display:flex;flex-direction:column;gap:4px;min-width:110px}
.fremdrift .bar{width:100%}
.fremdrift .bar .m{background:var(--today)} .fremdrift .bar .u{background:var(--tom)}
.dato-celle{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:150px}
.ret{font:inherit;font-size:12px;background:none;border:0;color:var(--link);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.ret-form{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ret-form input[type=date]{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--accent);border-radius:8px;background:var(--panel);color:var(--ink)}
.ret-form button{font:inherit;font-size:12.5px;border-radius:99px;padding:4px 11px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink2)}
.ret-form button.gem{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ret-form button:disabled{opacity:.6;cursor:wait}
.ret-fejl{flex-basis:100%;font-size:12px;color:var(--late)}
.ps-tal{font-weight:500}
.ps-tal.nul{color:var(--ink3);font-weight:400}
.solgt{color:var(--accent);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;box-shadow:var(--shadow);z-index:10;max-width:calc(100vw - 32px)}
.toast.fejl{background:var(--late);color:#fff}

/* Ankomster */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.day h3{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15.5px;font-weight:500}
.day h3 .n{font-family:var(--mono);font-size:12.5px;color:var(--ink2);font-weight:400;white-space:nowrap}

<script>
(function(){
const BLOB = JSON.parse(document.getElementById('data').textContent);
const NOEGLE = 'lv_noegle';
const WORKER = '__WORKER__';
let NOEGLE_B64 = null;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tilB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const hent = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const gem = (k,v) => { try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} };
async function afled(kode){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(kode), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(BLOB.salt), iterations:BLOB.iter}, base, 256);
}
async function dekrypter(raw){
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(BLOB.iv)}, k, b64(BLOB.ct));
  const tekst = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(tekst);
}
async function aabn(){
  const gemt = hent(NOEGLE) || (()=>{ try { return sessionStorage.getItem(NOEGLE); } catch(e){ return null; } })();
  if (gemt){
    try { const D = await dekrypter(b64(gemt)); NOEGLE_B64 = gemt; vis(D); return; } catch(e){ gem(NOEGLE, null); }
  }
  document.getElementById('laas').hidden = false;
  document.getElementById('kode').focus();
}
document.getElementById('laasform').addEventListener('submit', async e => {
  e.preventDefault();
  const knap = document.getElementById('aabn'), fejl = document.getElementById('fejl');
  knap.disabled = true; knap.textContent = 'Åbner …'; fejl.hidden = true;
  try {
    const raw = await afled(document.getElementById('kode').value);
    const D = await dekrypter(raw);
    const v = tilB64(raw);
    NOEGLE_B64 = v;
    if (document.getElementById('husk').checked) gem(NOEGLE, v);
    else { try { sessionStorage.setItem(NOEGLE, v); } catch(_){} }
    document.getElementById('laas').hidden = true;
    vis(D);
  } catch(err) {
    fejl.hidden = false; knap.disabled = false; knap.textContent = 'Åbn';
    document.getElementById('kode').select();
  }
});
document.getElementById('logud').addEventListener('click', () => {
  gem(NOEGLE, null); try { sessionStorage.removeItem(NOEGLE); } catch(e){}
  location.reload();
});
// Hent nye tal automatisk: hver minut tjekkes, om der er udgivet en ny version af siden.
// Genindlæs kun, når der er nye tal, og ingen er i gang med at søge eller kigge i en PO.
let version = null;
async function nyVersion() {
  try {
    const r = await fetch(location.pathname, {method: 'HEAD', cache: 'no-store'});
    const v = r.headers.get('last-modified') || r.headers.get('etag');
    if (!v) return false;
    if (version === null) { version = v; return false; }
    return v !== version;
  } catch(e) { return false; }
}
async function tjek() {
  if (document.visibilityState !== 'visible') return;
  if (document.querySelector('details.lok[open], details[data-po][open]') || document.activeElement.matches('input')) return;
  if (await nyVersion()) location.reload();
}
nyVersion();
setInterval(tjek, 60e3);
document.addEventListener('visibilitychange', tjek);
aabn();

function vis(D){
document.getElementById('app').hidden = false;
const SP_PO = id => 'https://lisen.smartpack.dk/admin/customers/PurchaseOrders/Form?id=9d9288cc-5982-4339-bf14-639183815195&purchaseOrder=' + id;
// Ordrenumre åbner ordren i SmartPack
const SP_ORD = id => 'https://lisen.smartpack.dk/admin/customers/orders/info?orderId=' + encodeURIComponent(id);
function ordA(o){
  return '<a href="'+SP_ORD(o.id)+'" target="_blank" rel="noopener" title="Åbn i SmartPack">'+esc(o.n)+'</a>';
}
const $ = s => document.querySelector(s);
const IMGP = D.imgp || '';
const IMG = u => !u ? '' : (u[0] === '~' ? IMGP + u.slice(1) : u);
const tn = u => u ? '<img class="tn" src="'+esc(IMG(u))+'" alt="" loading="lazy" referrerpolicy="no-referrer" width="38" height="48">' : '<span class="tn tom"></span>';
const kortBillede = u => u ? '<img src="'+esc(IMG(u))+'" alt="" loading="lazy" referrerpolicy="no-referrer" width="84" height="104">' : '<div class="noimg">intet billede</div>';
// Lokationer på varekort: foldet sammen som standard; husk hvilke der er åbne mellem opdateringer af listen
const aabneLok = new Set();
let alleLok = false;
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!d.matches || !d.matches('details.lok')) return;
  if (d.open) aabneLok.add(d.dataset.k); else aabneLok.delete(d.dataset.k);
}, true);
function lokationer(nøgle, hylder, fortegn){
  if (!hylder.length) return '';
  const aaben = alleLok || aabneLok.has(nøgle);
  const sum = hylder.reduce((a,h)=>a+h[1],0);
  return '<details class="lok" data-k="'+esc(nøgle)+'"'+(aaben?' open':'')+'><summary>'+(fortegn||'Lokationer')+' · '+hylder.length+(hylder.length===1?' hylde':' hylder')+'</summary>'+
    '<div class="hylder">'+hylder.map(h=>'<span class="hylde" title="'+esc(h[0])+'">'+esc(h[0].replace(/^Hall /,''))+' — '+nf(h[1])+' stk</span>').join('')+'</div></details>';
}
function lokKnap(){
  return '<button type="button" class="filter-knap" id="alle-lok" aria-pressed="'+alleLok+'">'+(alleLok?'Fold alle lokationer sammen':'Vis alle lokationer')+'</button>';
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => Math.round(n).toLocaleString('da-DK');
const MDR = ['jan.','feb.','mar.','apr.','maj','jun.','jul.','aug.','sep.','okt.','nov.','dec.'];
const DAGE = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let now = new Date();
const I_DAG = iso(now);
const I_MORGEN = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()+1));
const OM_7 = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()+7));
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const kortDato = s => { const d = pd(s); return d.getDate()+'. '+MDR[d.getMonth()]; };
const dagNavn = s => DAGE[pd(s).getDay()];
const dageSiden = s => Math.floor((now - new Date(s)) / 864e5);
const dageMellem = (a,b) => Math.round((pd(b)-pd(a))/864e5);

function spand(dato){
  if (dato < I_DAG) return 'late';
  if (dato === I_DAG) return 'today';
  if (dato === I_MORGEN) return 'tom';
  return 'later';
}
function datoBadge(dato){
  const s = spand(dato);
  let t;
  if (s==='late'){ const n = dageMellem(dato, I_DAG); t = 'Forsinket '+n+' '+(n===1?'dag':'dage')+' · '+kortDato(dato); }
  else if (s==='today') t = 'I dag';
  else if (s==='tom') t = 'I morgen';
  else t = dagNavn(dato).slice(0,3)+'. '+kortDato(dato);
  return '<span class="badge b-'+s+'">'+esc(t)+'</span>';
}
function alderTxt(t){
  const n = dageSiden(t);
  return '<span class="age'+(n>=7?' gl':'')+'">'+(n<=0?'i dag':n+' d')+'</span>';
}

let toastTmr;
function toast(tekst, fejl){
  const t = $('#toast'); t.textContent = tekst; t.className = 'toast'+(fejl?' fejl':''); t.hidden = false;
  clearTimeout(toastTmr); toastTmr = setTimeout(()=>{ t.hidden = true; }, fejl?8000:6000);
}

async function hmacHex(noegleB64, besked){
  const k = await crypto.subtle.importKey('raw', b64(noegleB64), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  const s = await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(besked));
  return [...new Uint8Array(s)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function gemDato(id){
  const input = document.getElementById('ret-dato-'+id);
  const dato = input && input.value;
  const p = AP.find(x=>x.id===id);
  if (!dato || !/^\d{4}-\d{2}-\d{2}$/.test(dato)){ redigerFejl = 'Vælg en dato.'; render(); return; }
  if (p && dato === p.dato){ redigerer = null; redigerFejl = ''; render(); return; }
  if (!NOEGLE_B64){ redigerFejl = 'Log ud og ind igen for at kunne gemme.'; render(); return; }
  gemmer = true; redigerFejl = ''; render();
  try {
    const t = Date.now();
    const sig = await hmacHex(NOEGLE_B64, 'po-dato|'+id+'|'+dato+'|'+t);
    const r = await fetch(WORKER+'/po/dato', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id, dato, t, sig})});
    let svar = {}; try { svar = await r.json(); } catch(_){}
    if (!r.ok || !svar.ok) throw new Error(svar.fejl || ('Fejl '+r.status));
    [AP, D.po].forEach(liste => liste.forEach(x => { if (x.id===id){ x.dato = dato; if ('s' in x) x.s = spand(dato); } }));
    aendrede.add(id); redigerer = null; gemmer = false;
    render();
    toast('PO '+id+': forventet dato ændret til '+kortDato(dato)+(svar.gammel?' (før '+kortDato(svar.gammel)+')':'')+'. Resten af dashboardet opdateres inden for ca. 10 minutter.');
  } catch(err){
    gemmer = false; redigerFejl = err.message || 'Kunne ikke gemme.';
    render();
  }
}

function visDage(){
  const q = state.q;
  const ps = D.po.filter(p=>!q || p.soeg.includes(q));
  const grupper = new Map();
  const late = ps.filter(p=>p.s==='late');
  if (late.length) grupper.set('late', late);
  ps.filter(p=>p.s!=='late').sort((a,b)=>a.dato<b.dato?-1:1).forEach(p=>{ if(!grupper.has(p.dato)) grupper.set(p.dato,[]); grupper.get(p.dato).push(p); });
  const maks = Math.max(1,...[...grupper.values()].map(g=>g.reduce((a,p)=>a+p.stk,0)));
  if (!grupper.size) return '<div class="empty">Ingen forsendelser matcher.</div>';
  return '<div class="days">'+[...grupper.entries()].map(([k,g])=>{
    const stk = g.reduce((a,p)=>a+p.stk,0), fs = g.reduce((a,p)=>a+p.ps,0), ord = g.reduce((a,p)=>a+p.ordrer.length,0);
    const s = k==='late'?'late':spand(k);
    const titel = k==='late'?'Forsinket':(s==='today'?'I dag':s==='tom'?'I morgen':dagNavn(k)[0].toUpperCase()+dagNavn(k).slice(1))+' · '+kortDato(k);
    g.sort((a,b)=>(b.ordrer.length-a.ordrer.length)||(b.stk-a.stk));
    return '<div class="day '+(s==='late'?'late':s==='today'?'today':'')+'"><h3><span>'+esc(titel)+'</span><span class="n">'+nf(stk)+' stk</span></h3>'+
      '<div class="bar" title="'+nf(fs)+' presell af '+nf(stk)+'"><i class="p" style="width:'+(fs/maks*100)+'%"></i><i class="o" style="width:'+((stk-fs)/maks*100)+'%"></i></div>'+
      '<div style="font-size:12.5px;color:var(--ink2)">'+g.length+' forsendelser · '+nf(fs)+' presell · '+ord+' ordrer venter</div>'+
      '<ul>'+g.map(p=>'<li><button data-goto="'+p.id+'"><span>'+esc(p.lev)+'</span><span class="rf">PO '+p.id+(k==='late'?' · '+kortDato(p.dato):'')+(p.ref?' · '+esc(p.ref):'')+'</span></button><span class="num">'+(p.ordrer.length?'<span class="badge b-ps">'+p.ordrer.length+' ordr.</span> ':'')+nf(p.stk)+'</span></li>').join('')+'</ul></div>';
  }).join('')+'</div>';
}

  v.sort((a,b)=>{ const A=a[k],B=b[k]; return (typeof A==='number'? (A-B) : String(A).localeCompare(String(B),'da'))*dir; });
  const th = (key,label,r) => '<th class="'+(r?'r':'')+'"><button data-sort="'+key+'">'+label+(k===key?(dir>0?' ↑':' ↓'):'')+'</button></th>';
  const sum = v.reduce((a,x)=>a+x.stk,0);
  return '<p class="hint">'+v.length+' varianter · '+nf(sum)+' stk i ventende ordrer'+(state.span?' · kun '+spaender[state.span].toLowerCase():'')+'. Klik en kolonne for at sortere.</p>'+
   (v.length?'<div class="varer-tbl"><div class="scroll"><table><thead><tr>'+th('navn','Vare')+th('maerke','Mærke')+th('str','Str.')+th('stk','Solgt',1)+th('ps_po','På PO',1)+th('ordrer','Ordrer',1)+th('aeldst','Ældste ordre')+th('dato','Forventet')+th('po','PO')+'</tr></thead><tbody>'+
   v.map(x=>'<tr><td><div class="vare-celle">'+tn(x.img)+'<div>'+esc(x.navn)+(x.farve?' · '+esc(x.farve):'')+'<div class="sku">'+esc(x.sku)+'</div></div></div></td><td>'+esc(x.maerke)+'</td><td>'+esc(x.str)+'</td><td class="r num"><b>'+x.stk+'</b></td><td class="r num">'+nf(x.ps_po)+'</td><td class="r num">'+x.ordrer+'</td><td>'+alderTxt(x.aeldst)+'</td><td>'+datoBadge(x.dato)+'</td><td><a href="'+SP_PO(x.po)+'" target="_blank" rel="noopener" class="mono">'+x.po+'</a> '+(x.ref && x.ref!=='0'?'<div class="sku">'+esc(x.ref)+'</div>':'')+'</td></tr>').join('')+

function visKunHel(){

  const v = KH.filter(g=>(!khKunOrdrer || g.ord_stk>0) && (!q || (g.navn+' '+g.farve+' '+g.maerke+' '+g.varianter.map(x=>x.sku+' '+x.str).join(' ')+' '+g.hylder.map(h=>h[0]).join(' ')+' '+g.ordrer.map(o=>o.n).join(' ')).toLowerCase().includes(q)));

    const strl = [...pr.values()].map(x=>{
      const t = [x.n>1 ? x.n+' varianter' : '', x.ord>0 ? nf(x.ord)+' stk i åbne ordrer' : ''].filter(Boolean).join(' · ');
      return '<span'+(x.ord>0?' class="i-ordre"':'')+(t?' title="'+t+'"':'')+'>'+esc(x.str)+' <b>'+nf(x.stk)+'</b></span>';
    }).join('');
    const ord = g.antal_ordrer ? '<div class="flytordrer">'+nf(g.ord_stk)+' stk i '+g.antal_ordrer+(g.antal_ordrer===1?' åben ordre: ':' åbne ordrer: ')+g.ordrer.map(ordA).join(' ')+(g.antal_ordrer>g.ordrer.length?' …':'')+'</div>' : '';
    return '<div class="flytvare">'+kortBillede(g.img)+

      '<div class="meta">'+(g.maerke?'<span>'+esc(g.maerke)+'</span>':'')+'<span class="sku">'+esc(g.varianter.map(x=>x.sku).slice(0,2).join(', '))+(g.varianter.length>2?' …':'')+'</span></div>'+

const KOE = D.koe || [];
const KOE_ORDEN = ['ingenpo','po','flyt','hel','butik','klar'];
const KOE_INFO = {
  ingenpo:{navn:'Venter på varer uden indkøbsordre', grund:'Ordren venter på varer, som ingen åben PO har. Her skal der bestilles eller findes en anden løsning.'},
  po:     {navn:'Venter på varer på en indkøbsordre', grund:'Presell: varerne kommer med en åben PO. Datoen er den seneste af de PO\'er, ordren venter på – før den er ordren ikke komplet.'},
  flyt:   {navn:'Skal flyttes fra Helsinge', grund:'Ordren kan ikke pakkes samlet i Ramløse. Noget skal flyttes fra Helsinge først.'},
  hel:    {navn:'Pakkes i Helsinge', grund:'Alle varer i ordren ligger i Helsinge.'},
  butik:  {navn:'Skal hentes i butikken', grund:'En vare ligger hverken på Lager Ramløse eller i Helsinge, men står i butikken i Ramløse.'},
  klar:   {navn:'Klar til pak i Ramløse', grund:'Ingen hindring – alt kan plukkes på Lager Ramløse. Er en af dem gammel, er der noget galt.'},
};
const koeVenter = KOE.filter(o=>o.g!=='klar').length;
let koeGl = false;
const koeAlle = new Set();
let aabneKoe = new Set(['ingenpo','po']);
try { const g = localStorage.getItem('lv_koe'); if (g) aabneKoe = new Set(JSON.parse(g)); } catch(_){}
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!d.matches || !d.matches('details.koe-g')) return;
  if (d.open) aabneKoe.add(d.dataset.g); else aabneKoe.delete(d.dataset.g);
  try { localStorage.setItem('lv_koe', JSON.stringify([...aabneKoe])); } catch(_){}
}, true);

// Alder: 14 dage eller mere er kritisk, 7-13 dage er på vej derhen.
function koeAlder(t){
  const n = dageSiden(t);

}

function koeVare(v){
  const navn = [v.navn, v.farve].filter(Boolean).join(' · ');
  return '<span class="koe-vare" title="'+esc((v.maerke?v.maerke+' · ':'')+navn+(v.str?' · str. '+v.str:'')+' · '+v.sku)+'">'+
    (v.img?'<img src="'+esc(IMG(v.img))+'" alt="" loading="lazy" referrerpolicy="no-referrer" width="26" height="32">':'<i class="intet"></i>')+
    (v.maerke?'<i class="mk">'+esc(v.maerke)+'</i>':'')+
    '<span>'+esc(navn)+(v.str?' <b>'+esc(v.str)+'</b>':'')+(v.q>1?' · '+nf(v.q)+' stk':'')+'</span></span>';
}

function visKoe(){
  const q = state.q;
  const passer = o => (!koeGl || dageSiden(o.t) >= 7) &&
    (!q || (o.n+' '+(o.po||'')+' '+(o.varer||[]).map(v=>v.sku+' '+v.navn+' '+v.farve+' '+v.str).join(' ')).toLowerCase().includes(q));
  const valgt = KOE.filter(passer);
  const stkVenter = KOE.filter(o=>o.g!=='klar').reduce((a,o)=>a+o.stk,0);
  const aeldste = KOE.filter(o=>o.g!=='klar')[0];
  const sum = '<div class="flyt-sum">'+
    '<div class="hoved"><b class="num">'+nf(koeVenter)+'</b><span>åbne ordrer venter på noget</span></div>'+
    '<div><b class="num">'+nf(stkVenter)+'</b><span>stk i de ordrer</span></div>'+
    '<div><b class="num">'+(aeldste?dageSiden(aeldste.t)+' dage':'–')+'</b><span>har den ældste ventet</span></div>'+
    '<div><b class="num">'+nf(KOE.filter(o=>o.g==='klar').length)+'</b><span>ordrer kan pakkes i Ramløse nu</span></div></div>';
  const raekke = o => {
    let hoejre;
    if (o.g === 'po') hoejre = (o.dato?datoBadge(o.dato):'')+'<button type="button" class="po-knap" data-goto="'+o.po+'">PO '+o.po+'</button>'+nf(o.q)+' stk';
    else if (o.g === 'ingenpo') hoejre = '<span class="badge b-late">Ingen PO</span>'+nf(o.q)+' stk mangler';
    else if (o.g === 'flyt') hoejre = nf(o.q)+' stk fra Helsinge';
    else if (o.g === 'hel') hoejre = nf(o.q)+' stk i Helsinge';
    else if (o.g === 'butik') hoejre = nf(o.q)+' stk i butikken';
    else hoejre = nf(o.stk)+' stk klar';
    const v = (o.varer||[]).map(koeVare).join('')+(o.flere?'<span class="koe-vare" style="padding-left:11px"><span>+'+o.flere+' mere</span></span>':'');
    return '<div class="koe-ordre"><span class="nr">'+ordA(o)+'</span>'+koeAlder(o.t)+
      '<span class="varer">'+v+'</span><span class="hoejre">'+hoejre+'</span></div>';
  };
  const grupper = KOE_ORDEN.map(g => {
    const liste = valgt.filter(o=>o.g===g);
    if (!liste.length) return '';
    const i = KOE_INFO[g];
    const stk = liste.reduce((a,o)=>a+(g==='klar'?o.stk:o.q||o.stk),0);
    const vis = koeAlle.has(g) ? liste : liste.slice(0,25);
    return '<details class="koe-g" data-g="'+g+'"'+(aabneKoe.has(g)?' open':'')+'><summary>'+
      '<h3>'+esc(i.navn)+'</h3>'+
      '<span class="tal"><b>'+nf(liste.length)+'</b> '+(liste.length===1?'ordre':'ordrer')+' · <b>'+nf(stk)+'</b> stk · ældste <b>'+dageSiden(liste[0].t)+' d</b></span>'+
      '<span class="grund">'+esc(i.grund)+'</span></summary>'+
      vis.map(raekke).join('')+
      (liste.length>vis.length?'<button type="button" class="koe-mere" data-koe-mere="'+g+'">Vis alle '+nf(liste.length)+' ordrer →</button>':'')+
      '</details>';
  }).join('');
  return sum+'<p class="hint">Alle åbne ordrer, der ikke er sendt – hver ordre står ét sted, under den vigtigste grund. Ældste ordre øverst i hver gruppe. Ordrenumre åbner ordren i SmartPack. Ordrer fra butikken (POS) er ikke med.</p>'+
    '<div class="knaprad"><button type="button" class="filter-knap" id="koe-gl" aria-pressed="'+koeGl+'">Kun ordrer over 7 dage</button>'+
    '<button type="button" class="filter-knap" id="koe-fold">'+(aabneKoe.size?'Fold alle sammen':'Fold alle ud')+'</button></div>'+
    (grupper || '<div class="empty">'+(KOE.length?'Ingen ordrer matcher.':'Ingen åbne ordrer.')+'</div>');
}

// ---------------------------------------------------------------- Helsinge: overblik til lageret
const H = D.helsinge || {ordrer:[], varer:[]};
const SALG = D.salg || {dage:0, daekket:0};
const helStk = H.ordrer.reduce((a,o)=>a+o.stk,0);
let helKun = true;   // vis som udgangspunkt kun dem, der SKAL pakkes i Helsinge
const kritisk = liste => liste.filter(o=>dageSiden(o.t)>=7).length;

function hvare(v, ekstra, varm){
  const navn = [v.navn, v.farve].filter(Boolean).join(' · ');
  return '<div class="hvare'+(varm?' varm':'')+'" title="'+esc(navn+(v.str?' · str. '+v.str:'')+' · '+(v.sku||''))+'">'+
    (v.img?'<img src="'+esc(IMG(v.img))+'" alt="" loading="lazy" referrerpolicy="no-referrer" width="38" height="48">':'<span class="intet"></span>')+
    '<span class="txt"><b>'+esc(navn)+'</b>'+[v.str?'Str. '+esc(v.str):'', v.maerke?esc(v.maerke):''].filter(Boolean).join(' · ')+'</span>'+
    '<span class="antal">'+ekstra+'</span></div>';
}

function ordreChip(o, tekst){
  return '<span class="hels-ordre"><span class="nr">'+ordA(o)+'</span>'+koeAlder(o.t)+(tekst?'<span>'+tekst+'</span>':'')+'</span>';
}

// Salgstallene tælles op lidt ad gangen, så de første dage dækker de kun en del af vinduet.
function salgTekst(){
  if (!(SALG.daekket > 0)) return 'flest i åbne ordrer lige nu (salgstal er på vej)';
  return 'mest solgte de sidste '+(SALG.daekket < SALG.dage ? SALG.daekket : SALG.dage)+' dage';
}

// Varer, der kun ligger i Helsinge og sælger – de bør stå i Ramløse i stedet.
function borFlyttes(antal){
  const har = SALG.daekket > 0;
  const kandidater = KH.filter(g => (g.solgt||0) > 0 || g.ord_stk > 0)
    .sort((a,b)=> (b.solgt||0)-(a.solgt||0) || b.ord_stk-a.ord_stk || b.stk-a.stk);
  return {har, liste: kandidater.slice(0, antal), i_alt: kandidater.length};
}

function borFlyttesKort(g){
  const t = [];
  if ((g.solgt||0) > 0) t.push('<b>'+nf(g.solgt)+'</b> solgt');
  if (g.ord_stk > 0) t.push('<b>'+nf(g.ord_stk)+'</b> i ordrer');
  const v = {navn:g.navn, farve:g.farve, str:'', maerke:g.maerke, sku:(g.varianter[0]||{}).sku, img:g.img};
  return hvare(v, '<span style="font-size:12px">'+t.join('<br>')+'</span><small>'+nf(g.stk)+' stk i Helsinge</small>', (g.solgt||0) > 0);
}

function visHelsinge(){
  const flytKrit = kritisk(F.ordrer);
  const bf = borFlyttes(8);
  const tal = (n, tekst, krit) => '<div class="hels-tal'+(krit?' kritisk':'')+'"><b class="num">'+n+'</b><span>'+tekst+'</span></div>';

  const helSkal = H.ordrer.filter(o=>o.kun), helOgsaa = H.ordrer.filter(o=>!o.kun);
  const helValgt = helKun ? helSkal : H.ordrer;
  const helVarer = (helKun ? H.varer.filter(v=>v.stk_kun>0) : H.varer)
    .map(v => helKun ? Object.assign({}, v, {stk:v.stk_kun, ordrer:v.ordrer_kun}) : v)
    .sort((a,b)=>b.stk-a.stk);
  const helKrit = kritisk(helValgt);
  const p1 = '<section class="hels-panel"><h2><small>1 · Pak her</small>Ordrer, der kan pakkes færdige i Helsinge</h2>'+
    '<div class="hels-top">'+
      tal(nf(helSkal.length), 'ordrer <b>skal</b> pakkes her', false) +
      tal(nf(helOgsaa.length), 'kan også pakkes i Ramløse') +
      tal(nf(helValgt.reduce((a,o)=>a+o.stk,0)), 'stk skal plukkes') +
      tal(helKrit ? nf(helKrit) : '0', 'ordrer er over 7 dage', helKrit>0) +
      (helValgt.length ? tal(dageSiden(helValgt[0].t)+' d', 'har den ældste ventet', dageSiden(helValgt[0].t)>=7) : '') +
    '</div>'+
    '<p class="hint" style="margin:-4px 0 10px">Ordrer, der <b>skal</b> pakkes her, har mindst én vare, som ikke findes i Ramløse. Resten kan pakkes begge steder – i pluk-reglen har Ramløse forrang.</p>'+
    '<div class="knaprad"><button type="button" class="filter-knap" id="hel-kun" aria-pressed="'+helKun+'">Kun dem, der skal pakkes her ('+nf(helSkal.length)+')</button></div>'+
    (helVarer.length ? '<p class="hels-und">Mest plukkede varer</p><div class="hvarer">'+
        helVarer.slice(0,8).map(v=>hvare(v, nf(v.stk)+' stk<small>'+(v.ordrer===1?'1 ordre':v.ordrer+' ordrer')+'</small>')).join('')+'</div>' : '')+
    (helValgt.length ? '<p class="hels-und" style="margin-top:12px">Ordrer – ældste først</p><div class="hels-ordrer">'+
        helValgt.slice(0,40).map(o=>ordreChip(o, nf(o.stk)+' stk'+(!helKun&&o.kun?' · skal her':''))).join('')+
        (helValgt.length>40?'<span class="hels-ordre">+'+(helValgt.length-40)+' flere</span>':'')+'</div>'
      : '<div class="empty">Ingen ordrer kan pakkes færdige i Helsinge lige nu.</div>')+
    '</section>';

  const p2 = '<section class="hels-panel b2"><h2><small>2 · Send til Ramløse</small>Varer, der skal flyttes, før ordren kan pakkes samlet</h2>'+
    '<div class="hels-top">'+
      tal(nf(flytStk), 'stk skal flyttes') +
      tal(nf(F.varer.length), 'forskellige varer') +
      tal(nf(F.ordrer.length), 'ordrer venter på dem') +
      tal(flytKrit ? nf(flytKrit) : '0', 'ordrer er over 7 dage', flytKrit>0) +
      (F.ordrer.length ? tal(dageSiden(F.ordrer[0].t)+' d', 'har den ældste ventet', dageSiden(F.ordrer[0].t)>=7) : '') +
    '</div>'+
    (F.varer.length ? '<p class="hels-und">Flest stk først</p><div class="hvarer">'+
        F.varer.slice(0,8).map(v=>hvare(v, nf(v.stk)+' stk<small>'+(v.hylder[0]?esc(v.hylder[0][0].replace(/^Hall /,'')):'')+'</small>')).join('')+'</div>'+
        '<div class="knaprad" style="margin-top:12px"><button type="button" class="filter-knap" data-tab-goto="flyt">Se hele flyttelisten →</button></div>'
      : '<div class="empty">Ingenting skal flyttes lige nu.</div>')+
    '</section>';

  const p3 = '<section class="hels-panel b3"><h2><small>3 · Står kun her</small>Varer, der kun findes i Helsinge</h2>'+
    '<div class="hels-top">'+
      tal(nf(khVar), 'varianter') +
      tal(nf(khStk), 'stk') +
      tal(nf(KH.length), 'produkter') +
      tal(nf(khOrd.length), 'produkter er i åbne ordrer') +
    '</div>'+
    (bf.liste.length ? '<p class="hels-und">Bør flyttes til Ramløse – '+salgTekst()+'</p>'+
        '<div class="hvarer bred">'+bf.liste.map(borFlyttesKort).join('')+'</div>'+
        '<div class="knaprad" style="margin-top:12px"><button type="button" class="filter-knap" data-tab-goto="kunhel">Se alle varer, der kun er i Helsinge →</button></div>'
      : '<div class="empty">Ingen af varerne i Helsinge sælger lige nu.</div>')+
    '</section>';

  return '<p class="hint">Overblik til lageret i Helsinge: hvad der kan pakkes her, hvad der skal sendes til Ramløse, og hvad der kun står her. Ordrer, der er over 7 dage gamle, er markeret med rødt.</p>'+p1+p2+p3;
}

// ---------------------------------------------------------------- Returneringer
// Returpakker fra SmartPack: kunden opretter returen og får en label (Ventende),
// og sagen bliver Færdig, når lageret har behandlet den. "I transit" kender SmartPack ikke
// – derfor linkes der direkte til fragtfirmaets Track & Trace på hver ventende sag.
const R = D.retur || {stat:{}, ventende:[], dage:[], kasser:[]};
let returGl = false, returAlle = false;

function returDag(iso){
  const d = pd(iso.slice(0,10));
  return {kort: d.getDate()+'.', navn: dagNavn(iso.slice(0,10)), weekend: [0,6].includes(d.getDay())};
}

function returGraf(){
  const dage = R.dage || [];
  if (!dage.length) return '';
  const maks = Math.max(1, ...dage.map(d=>Math.max(d.op, d.fa)));
  const soejler = dage.map(d => {
    const i = returDag(d.d);
    const tekst = i.navn+' '+kortDato(d.d)+': '+nf(d.op)+' oprettet · '+nf(d.fa)+' færdige';
    return '<div class="graf-dag" title="'+esc(tekst)+'">'+
      '<div class="graf-soejler"><i style="height:'+(d.op/maks*100).toFixed(1)+'%"></i>'+
      '<i class="to" style="height:'+(d.fa/maks*100).toFixed(1)+'%"></i></div>'+
      '<small>'+i.kort+'</small></div>';
  }).join('');
  const tabel = dage.map(d=>returDag(d.d).navn+' '+kortDato(d.d)+': '+d.op+' oprettet, '+d.fa+' færdige').join(' · ');
  return '<div class="graf-top"><span class="graf-tegn"><i></i>Oprettet</span>'+
      '<span class="graf-tegn to"><i></i>Færdigbehandlet</span>'+
      '<span>Højeste dag: <b>'+nf(maks)+'</b> sager</span></div>'+
    '<div class="graf" role="img" aria-label="'+esc('Retursager pr. dag de sidste 14 dage. '+tabel)+'">'+soejler+'</div>';
}

function returSag(s){
  const alder = dageSiden(s.op);
  const spor = s.tt ? '<a href="'+esc(s.tt)+'" target="_blank" rel="noopener">Spor pakken →</a>' : '';
  return '<div class="ret-sag"><span class="nr">'+(s.oid?ordA({id:s.oid, n:s.ordre}):esc(s.ordre))+'</span>'+
    koeAlder(s.op)+
    '<span class="midt"><span>Oprettet '+kortDato(s.op.slice(0,10))+'</span>'+
      (s.fragt?'<span class="fragt">'+esc(s.fragt)+'</span>':'')+
      '<span>Forsendelse '+nf(s.nr)+'</span>'+
      '<span>'+nf(s.stk)+(s.stk===1?' vare':' varer')+'</span></span>'+
    '<span class="hoejre">'+spor+'</span></div>';
}

function visRetur(){
  const q = state.q;
  const st = R.stat || {};
  const passer = s => (!returGl || dageSiden(s.op) >= 7) &&
    (!q || (s.ordre+' '+s.nr+' '+(s.fragt||'')).toLowerCase().includes(q));
  const vent = (R.ventende || []).filter(passer);
  const sum = '<div class="flyt-sum">'+
    '<div class="hoved"><b class="num">'+nf(st.ventende||0)+'</b><span>ventende – oprettet, pakken er ikke modtaget</span></div>'+
    '<div><b class="num"'+(R.gamle?' style="color:var(--late)"':'')+'>'+nf(R.gamle||0)+'</b><span>af dem er over 7 dage gamle</span></div>'+
    '<div><b class="num">'+nf(st.faerdig||0)+'</b><span>færdigbehandlet</span></div>'+
    '<div><b class="num">'+(R.median!=null?R.median+' dage':'–')+'</b><span>fra oprettet til færdig (median)</span></div></div>';
  const liste = returAlle ? vent : vent.slice(0,40);
  return '<p class="hint">Returpakker fra SmartPack de sidste '+(R.dage_vindue||30)+' dage. En sag er <b>ventende</b>, fra kunden opretter returen og får en label, til pakken er modtaget på lageret – ældste øverst. SmartPack kender ikke pakken undervejs, så "Spor pakken" åbner fragtfirmaets Track &amp; Trace.'+
      (st.modtaget?' '+nf(st.modtaget)+' er modtaget og under behandling.':'')+
      (st.aflyst?' '+nf(st.aflyst)+' er aflyst.':'')+'</p>'+
    sum+
    '<section class="hels-panel b2"><h2><small>Udvikling</small>Oprettede og færdigbehandlede pr. dag</h2>'+
      returGraf()+
      (R.snit!=null?'<p class="hels-und" style="margin-top:10px;font-weight:400;color:var(--ink2)">'+nf(R.behandlet)+' sager er behandlet i perioden. Der går typisk <b>'+R.median+' dage</b> fra kunden opretter returen, til den er færdig (gennemsnit '+R.snit+').</p>':'')+
    '</section>'+
    '<section class="hels-panel"><h2><small>Ventende</small>Retursager, vi mangler at modtage</h2>'+
      '<div class="knaprad" style="margin:12px 0 0"><button type="button" class="filter-knap" id="ret-gl" aria-pressed="'+returGl+'">Kun over 7 dage ('+nf(R.gamle||0)+')</button>'+
      '<span class="tal" style="align-self:center;font-size:13px;color:var(--ink2)">'+nf(vent.length)+' sager · '+nf(vent.reduce((a,s)=>a+s.stk,0))+' varer</span></div>'+
      (liste.length ? liste.map(returSag).join('')+
        (vent.length>liste.length?'<button type="button" class="koe-mere" id="ret-mere">Vis alle '+nf(vent.length)+' sager →</button>':'')+
        (R.flere_ventende?'<p class="hint" style="margin:10px 18px 0">Kun de '+nf((R.ventende||[]).length)+' ældste sager vises.</p>':'')
        : '<div class="empty">Ingen ventende retursager'+(q||returGl?' matcher.':'.')+'</div>')+
    '</section>'+
    '<section class="hels-panel b3"><h2><small>På lageret</small>Returkasser, der venter på at komme på plads</h2>'+
      '<div class="hels-top">'+
        '<div class="hels-tal"><b class="num">'+nf(R.kasse_stk||0)+'</b><span>stk i returkasserne</span></div>'+
        '<div class="hels-tal"><b class="num">'+nf((R.kasser||[]).length)+'</b><span>kasser i brug</span></div>'+
        ((R.kasser||[])[0] && R.kasser[0].aeldst ? '<div class="hels-tal'+(dageSiden(R.kasser[0].aeldst)>=7?' kritisk':'')+'"><b class="num">'+dageSiden(R.kasser[0].aeldst)+' d</b><span>har den ældste ligget</span></div>' : '')+
      '</div>'+
      ((R.kasser||[]).length ? '<div class="kasser">'+R.kasser.map(k=>{
          const a = k.aeldst ? dageSiden(k.aeldst) : null;
          return '<div class="kasse'+(a>=7?' gl':'')+'"><b>'+esc(k.navn)+'</b>'+
            '<span>'+nf(k.stk)+' stk · '+nf(k.linjer)+(k.linjer===1?' vare':' varer')+'</span>'+
            (a!=null?'<span>ældste '+(a<=0?'i dag':a+' dage')+'</span>':'')+'</div>';
        }).join('')+'</div>' : '<div class="empty">Returkasserne er tomme.</div>')+
    '</section>';
}

// ---------------------------------------------------------------- Butikkens lager
const BL = D.butikslager || {varer:[], maerker:[], typer:[], stroer:[]};
let blKun = false;

function fordeling(titel, raekker, enhed){
  if (!raekker || !raekker.length) return '';
  const maks = Math.max(...raekker.map(r=>r[1]));
  return '<div><p class="hels-und">'+esc(titel)+'</p><div class="ford">'+
    raekker.map(r=>'<span title="'+esc(r[0])+'">'+esc(r[0])+'</span>'+
      '<i style="width:'+Math.max(2,(r[1]/maks*100)).toFixed(1)+'%" aria-hidden="true"></i>'+
      '<b>'+nf(r[1])+(enhed?' '+enhed:'')+'</b>').join('')+'</div></div>';
}

function visButikslager(){
  const q = state.q;
  const v = (BL.varer||[]).filter(g => (!blKun || g.kun>0) &&
    (!q || (g.navn+' '+g.farve+' '+g.maerke+' '+g.type+' '+g.varianter.map(x=>x.sku+' '+x.str).join(' ')).toLowerCase().includes(q)));
  const sum = '<div class="flyt-sum">'+
    '<div class="hoved"><b class="num">'+nf(BL.stk||0)+'</b><span>stk står i butikken i Ramløse</span></div>'+
    '<div><b class="num">'+nf(BL.produkter||0)+'</b><span>produkter · '+nf(BL.varianter||0)+' størrelser</span></div>'+
    '<div><b class="num">'+nf(BL.kun_butik||0)+'</b><span>stk findes kun her (intet på lagrene)</span></div>'+
    '<div><b class="num">'+nf(BL.vaerdi||0)+' kr</b><span>i udsalgspris ('+nf(BL.kost||0)+' kr i kostpris)</span></div></div>';
  const kort = g => {
    const pr = new Map();
    g.varianter.forEach(x=>{ const k=x.str||x.sku; const a=pr.get(k)||{str:k,stk:0,n:0}; a.stk+=x.stk; a.n++; pr.set(k,a); });
    const strl = [...pr.values()].map(x=>'<span'+(x.n>1?' title="'+x.n+' varianter"':'')+'>'+esc(x.str)+' <b>'+nf(x.stk)+'</b></span>').join('');
    const meta = [g.maerke, g.type, g.pris?nf(g.pris)+' kr':'', g.solgt?nf(g.solgt)+' solgt på '+(SALG.daekket||SALG.dage)+' dage':'']
      .filter(Boolean).map(t=>'<span>'+esc(t)+'</span>').join('');
    return '<div class="flytvare">'+kortBillede(g.img)+
      '<div><h3>'+esc(g.navn)+(g.farve?' <small>· '+esc(g.farve)+'</small>':'')+'</h3>'+
      '<div class="meta">'+meta+'</div>'+
      '<div class="strl">'+strl+'</div>'+
      (g.kun>0?'<div class="flytordrer">'+nf(g.kun)+' stk findes kun i butikken</div>':'')+'</div>'+
      '<div class="flytantal"><b class="num">'+nf(g.stk)+'</b><span>stk i butikken</span></div></div>';
  };
  return sum+
    '<section class="hels-panel b3"><h2><small>Fordeling</small>Hvad står der i butikken?</h2>'+
      '<div class="ford-kol">'+
        fordeling('Mærker'+(BL.maerker_i_alt>BL.maerker.length?' (de '+BL.maerker.length+' største af '+BL.maerker_i_alt+')':''), BL.maerker, 'stk')+
        fordeling('Varetyper', BL.typer, 'stk')+
        fordeling('Størrelser', BL.stroer, 'stk')+
      '</div>'+
    '</section>'+
    '<div class="knaprad"><button type="button" class="filter-knap" id="bl-kun" aria-pressed="'+blKun+'">Kun varer, der ikke er på lagrene</button></div>'+
    '<p class="hint">Alt, der ligger på butikkens placeringer i Ramløse. Størrelser er lagt sammen pr. produkt og farve, og "solgt" er webshop-salget i perioden. Flest stk øverst.</p>'+
    (v.length ? '<div class="flytliste">'+v.slice(0,120).map(kort).join('')+'</div>'+
        (v.length>120?'<p class="hint" style="margin-top:10px">Viser de 120 første af '+nf(v.length)+' produkter – søg for at finde resten.</p>':'')
      : '<div class="empty">'+((BL.varer||[]).length?'Ingen varer matcher.':'Der står ikke noget i butikken.')+'</div>');
}

// Populært på webshoppen, men ikke i butikken
function visPopulaere(){
  const q = state.q;
  const P = (BL.populaere || []).filter(g => !q ||
    (g.navn+' '+g.farve+' '+g.maerke+' '+g.type+' '+g.varianter.map(x=>x.sku+' '+x.str).join(' ')).toLowerCase().includes(q));
  const dage = SALG.daekket ? Math.min(SALG.daekket, SALG.dage) : SALG.dage;
  const sum = '<div class="flyt-sum">'+
    '<div class="hoved"><b class="num">'+nf(P.length)+'</b><span>populære varer mangler i butikken</span></div>'+
    '<div><b class="num">'+nf(P.reduce((a,g)=>a+g.solgt,0))+'</b><span>stk solgt på webshoppen på '+dage+' dage</span></div>'+
    '<div><b class="num">'+nf(P.reduce((a,g)=>a+g.lager+g.hel,0))+'</b><span>stk står klar på lagrene</span></div></div>';
  const kort = g => {
    const strl = g.varianter.map(x=>'<span title="'+esc(nf(x.solgt)+' solgt · '+nf(x.lager+x.hel)+' på lagrene')+'">'+
      esc(x.str)+' <b>'+nf(x.solgt)+'</b></span>').join('');
    const meta = [g.maerke, g.type, g.pris?nf(g.pris)+' kr':''].filter(Boolean).map(t=>'<span>'+esc(t)+'</span>').join('');
    return '<div class="flytvare">'+kortBillede(g.img)+
      '<div><h3>'+esc(g.navn)+(g.farve?' <small>· '+esc(g.farve)+'</small>':'')+'</h3>'+
      '<div class="meta">'+meta+'</div>'+
      '<div class="strl">'+strl+'</div></div>'+
      '<div class="flytantal"><b class="num">'+nf(g.solgt)+'</b><span>solgt på '+dage+' dage</span></div></div>';
  };
  return sum+'<p class="hint">Varer, der sælger på webshoppen lige nu, men ikke står i butikken – og som kan hentes på lagrene. Tallet til højre er solgte stk de sidste '+dage+' dage'+(SALG.daekket&&SALG.daekket<SALG.dage?' (salgstallene dækker indtil videre '+SALG.daekket+' af '+SALG.dage+' dage)':'')+'. Tallet ved hver størrelse er, hvor mange der er solgt af den størrelse. Én linje pr. farve.</p>'+
    (P.length ? '<div class="flytliste">'+P.map(kort).join('')+'</div>'
      : '<div class="empty">'+((BL.populaere||[]).length?'Ingen varer matcher.':'Ingen varer mangler i butikken lige nu.')+'</div>');
}

// Genopfyldning: solgt i butikken, men ikke på hylden længere
const GF = D.genopfyld || {varer:[], dage:7};
let gfKun = true;   // som udgangspunkt kun dem, der kan hentes på lagrene

function visGenopfyld(){
  const q = state.q;
  const v = (GF.varer||[]).filter(g => (!gfKun || (g.kan_hentes>0)) &&
    (!q || (g.navn+' '+g.farve+' '+g.maerke+' '+g.type).toLowerCase().includes(q)));
  const sum = '<div class="flyt-sum">'+
    '<div class="hoved"><b class="num">'+nf(GF.udsolgt||0)+'</b><span>varer er solgt ud af butikken</span></div>'+
    '<div><b class="num">'+nf(GF.udsolgt_kan||0)+'</b><span>af dem står klar på lagrene</span></div>'+
    '<div><b class="num">'+nf(GF.stoerrelser_tomme||0)+'</b><span>tomme størrelser i alt</span></div>'+
    '<div><b class="num">'+nf(GF.solgt||0)+'</b><span>stk solgt i butikken på '+(GF.dage||7)+' dage</span></div></div>';
  const kort = g => {
    const strl = g.varianter.map(x=>{
      const tom = x.butik<=0 && x.solgt>0, kan = tom && x.lager>0;
      const kl = kan ? ' class="i-ordre"' : '';
      return '<span'+kl+' title="'+esc(nf(x.solgt)+' solgt · '+nf(x.butik)+' tilbage i butikken · '+nf(x.lager)+' på lagrene')+'">'+
        esc(x.str)+' <b>'+nf(x.solgt)+'</b>'+(tom?' · tom':' · '+nf(x.butik)+' igen')+'</span>';
    }).join('');
    const meta = [g.maerke, g.type, g.pris?nf(g.pris)+' kr':'',
      g.butik>0 ? nf(g.butik)+' stk tilbage i butikken' : 'ikke mere i butikken',
      (g.lager+g.hel)>0 ? nf(g.lager+g.hel)+' stk på lagrene' : 'heller ikke på lagrene',
      g.web ? nf(g.web)+' solgt på webshoppen' : ''].filter(Boolean).map(t=>'<span>'+esc(t)+'</span>').join('');
    return '<div class="flytvare">'+kortBillede(g.img)+
      '<div><h3>'+esc(g.navn)+(g.farve?' <small>· '+esc(g.farve)+'</small>':'')+'</h3>'+
      '<div class="meta">'+meta+'</div>'+
      '<div class="strl">'+strl+'</div></div>'+
      '<div class="flytantal"><b class="num">'+nf(g.solgt)+'</b><span>solgt på '+(GF.dage||7)+' dage</span></div></div>';
  };
  return sum+
    '<p class="hint">Varer, der er solgt i butikken de sidste '+(GF.dage||7)+' dage. Ved hver størrelse står, hvor mange der er solgt, og om der er noget tilbage på hylden – <b>tom</b> betyder udsolgt i butikken. Størrelser med lilla kant kan hentes på lagrene med det samme. Tomme hylder står øverst.</p>'+
    '<div class="knaprad"><button type="button" class="filter-knap" id="gf-kun" aria-pressed="'+gfKun+'">Kun dem, der kan hentes på lagrene</button></div>'+
    (v.length ? '<div class="flytliste">'+v.slice(0,120).map(kort).join('')+'</div>'+
        (v.length>120?'<p class="hint" style="margin-top:10px">Viser de 120 første af '+nf(v.length)+' – søg for at finde resten.</p>':'')
      : '<div class="empty">'+((GF.varer||[]).length
            ? (gfKun && !q ? 'Ingen af de udsolgte varer findes på lagrene lige nu – slå filteret fra for at se dem alle.' : 'Ingen varer matcher.')
            : 'Der er ikke solgt noget i butikken i perioden.')+'</div>');
}

// ---------------------------------------------------------------- Analyse: salg mod lager
const AN = D.analyse || {maerker:[], typer:[], uden_butik:[], i_alt:{}};
let anSort = 'stk';

function anRaekker(liste){
  const maks = Math.max(1, ...liste.map(r=>r.stk));
  const sorter = {stk:(a,b)=>b.stk-a.stk, solgt:(a,b)=>b.solgt-a.solgt, vaerdi:(a,b)=>b.vaerdi-a.vaerdi,
    pct:(a,b)=>anPct(b)-anPct(a)}[anSort] || ((a,b)=>b.stk-a.stk);
  return liste.slice().sort(sorter).map(r=>{
    const pct = anPct(r);
    const uge = AN.dage ? (r.solgt / AN.dage * 7) : 0;                 // stk pr. uge i butikken
    const webuge = AN.web_dage ? (r.web / AN.web_dage * 7) : 0;        // stk pr. uge online
    const andel = (uge + webuge) > 0 ? Math.round(100 * uge / (uge + webuge)) : 0;
    const uger = r.solgt > 0 ? (r.stk / (r.solgt / AN.dage * 7)) : null;
    const kl = [r.solgt === 0 && r.stk >= 10 ? 'doed' : '', pct >= 20 ? 'hurtig' : ''].filter(Boolean).join(' ');
    return '<tr'+(kl?' class="'+kl+'"':'')+'>'+
      '<td class="navn">'+esc(r.navn)+'</td>'+
      '<td class="r num">'+nf(r.stk)+'</td>'+
      '<td class="r num">'+nf(r.solgt)+'</td>'+
      '<td class="r pct"><span class="bar"><i style="width:'+Math.min(100, pct*2).toFixed(0)+'%"></i>'+pct.toFixed(0)+' %</span></td>'+
      '<td class="r num">'+(r.stk<=0 ? 'tom' : uger!=null ? (uger<100?uger.toFixed(1):'99+') : '–')+'</td>'+
      '<td class="r num">'+nf(r.web)+'</td>'+
      '<td class="r num">'+andel+' %</td>'+
      '<td class="r num">'+nf(r.vaerdi)+'</td></tr>';
  }).join('');
}
function anPct(r){ const g = r.stk + r.solgt; return g ? 100 * r.solgt / g : 0; }

function anTabel(titel, liste, hvad){
  return '<section class="hels-panel b3"><h2><small>'+esc(hvad)+'</small>'+esc(titel)+'</h2>'+
    '<div class="scroll" style="max-height:none;margin-top:12px"><table class="an-tbl"><thead><tr>'+
      '<th>'+esc(hvad)+'</th><th class="r">I butikken</th><th class="r">Solgt '+AN.dage+' dg</th>'+
      '<th class="r">Sælger</th><th class="r">Uger tilbage</th><th class="r">Web '+AN.web_dage+' dg</th>'+
      '<th class="r">Butikkens andel</th><th class="r">Værdi</th></tr></thead><tbody>'+
      anRaekker(liste)+'</tbody></table></div></section>';
}

function visAnalyse(){
  const i = AN.i_alt || {};
  const m = AN.maerker || [];
  const hurtige = m.filter(r=>anPct(r) >= 20 && r.stk >= 10).sort((a,b)=>anPct(b)-anPct(a)).slice(0,4);
  const doede = m.filter(r=>r.solgt === 0 && r.stk >= 10).sort((a,b)=>b.vaerdi-a.vaerdi).slice(0,5);
  const stoerst = m.slice().sort((a,b)=>b.vaerdi-a.vaerdi)[0];
  const pctIalt = i.stk+i.solgt ? 100*i.solgt/(i.stk+i.solgt) : 0;
  const sum = '<div class="flyt-sum">'+
    '<div class="hoved"><b class="num">'+nf(i.solgt||0)+'</b><span>stk solgt i butikken på '+AN.dage+' dage</span></div>'+
    '<div><b class="num">'+pctIalt.toFixed(0)+' %</b><span>af beholdningen er solgt i perioden</span></div>'+
    '<div><b class="num">'+nf(i.stk||0)+'</b><span>stk på hylderne ('+nf(i.maerker||0)+' mærker)</span></div>'+
    '<div><b class="num">'+nf(i.vaerdi||0)+' kr</b><span>i udsalgspris</span></div></div>';
  const noter = '<div class="an-noter">'+
    (hurtige.length?'<div class="an-note god"><b>Sælger hurtigst:</b> '+hurtige.map(r=>esc(r.navn)+' ('+anPct(r).toFixed(0)+' %)').join(', ')+'. De kunne tåle mere hyldeplads.</div>':'')+
    (doede.length?'<div class="an-note gl"><b>Står stille:</b> '+doede.map(r=>esc(r.navn)+' ('+nf(r.stk)+' stk / '+nf(r.vaerdi)+' kr)').join(', ')+' – intet solgt på '+AN.dage+' dage.</div>':'')+
    (stoerst?'<div class="an-note"><b>Største position:</b> '+esc(stoerst.navn)+' med '+nf(stoerst.vaerdi)+' kr ('+Math.round(100*stoerst.vaerdi/(i.vaerdi||1))+' % af butikkens værdi) og '+anPct(stoerst).toFixed(0)+' % solgt i perioden.</div>':'')+
    ((AN.uden_butik||[]).length?'<div class="an-note gl"><b>Sælger online, men står slet ikke i butikken:</b> '+AN.uden_butik.slice(0,5).map(x=>esc(x.navn)+' ('+nf(x.web)+' stk)').join(', ')+'.</div>':'')+
    '</div>';
  return sum+
    '<p class="hint">Butikkens hylder holdt op mod salget. <b>Sælger</b> er andelen af beholdningen, der er solgt i perioden, og <b>uger tilbage</b> er, hvor længe beholdningen rækker i samme tempo. <b>Butikkens andel</b> er, hvor stor en del af efterspørgslen der sker i butikken frem for på webshoppen (omregnet til samme uge). Røde rækker har ikke solgt noget; grønne procenter sælger hurtigt.</p>'+
    '<div class="knaprad">'+
      ['stk','Mest på lager','solgt','Mest solgt','pct','Sælger hurtigst','vaerdi','Største værdi']
        .reduce((a,x,n,arr)=> n%2 ? a : a.concat('<button type="button" class="filter-knap" data-an-sort="'+arr[n]+'" aria-pressed="'+(anSort===arr[n])+'">'+arr[n+1]+'</button>'), []).join('')+
    '</div>'+
    noter+
    anTabel('Mærker', AN.maerker||[], 'Mærke')+
    anTabel('Varetyper', AN.typer||[], 'Type');
}

// Fem områder øverst, med underfaner under. Sidst valgte underfane huskes pr. område.
const KAT = [
  {k:'vare',  navn:'Varemodtagelse', url:'varemodtagelse', faner:['prio','allepo','dage','varer','uden']},
  {k:'pluk',  navn:'Pluk & pak',     url:'pluk',           faner:['koe']},
  {k:'ret',   navn:'Retur',          url:'retur',          faner:['retur']},
  {k:'hel',   navn:'Helsinge',       url:'helsinge',       faner:['hels','flyt','kunhel']},
  {k:'but',   navn:'Butik',          url:'butik',          faner:['butik','butlager','butpop','genopfyld','analyse']},
];
const BASE = '__BASE__', START = '__START__';
if (START && KAT.some(k=>k.faner.includes(START))) state.tab = START;
function saetAdresse(k){
  try { history.replaceState(null, '', BASE + k.url + '/'); } catch(_){}
}
const FANENAVN = {prio:'Prioritet', allepo:"Alle PO'er", dage:'Ankomster', varer:'Presell-varer',
  uden:'Presell uden PO', koe:'Ordrer i kø', retur:'Returneringer', hels:'Overblik',
  flyt:'Flyt fra Helsinge', kunhel:'Kun i Helsinge', butik:'Hent til ordrer', butlager:'Butikkens lager', butpop:'Populært lige nu', genopfyld:'Genopfyldning', analyse:'Analyse'};
let sidsteFane = {};
try { sidsteFane = JSON.parse(localStorage.getItem('lv_faner') || '{}') || {}; } catch(_){}
const katFor = t => KAT.find(k => k.faner.includes(t)) || KAT[0];
function faneTal(t){
  return {prio:D.po.length, allepo:AP.length, dage:null, varer:D.varer.length, uden:D.uden_po.length,
    koe:koeVenter, retur:(D.retur&&D.retur.stat?D.retur.stat.ventende:0),
    hels:H.ordrer.filter(o=>o.kun).length, flyt:F.ordrer.length, kunhel:khVar,
    butik:B.filter(x=>x.nu>0).length, butlager:BL.produkter, butpop:(BL.populaere||[]).length, genopfyld:(GF.udsolgt_kan||0), analyse:null}[t];
}
function katTal(k){
  return {vare:D.po.length, pluk:koeVenter, ret:(D.retur&&D.retur.stat?D.retur.stat.ventende:0),
    hel:H.ordrer.filter(o=>o.kun).length+F.ordrer.length, but:B.filter(x=>x.nu>0).length}[k];
}
function gemFane(){
  sidsteFane[katFor(state.tab).k] = state.tab;
  try { localStorage.setItem('lv_tab', state.tab); localStorage.setItem('lv_faner', JSON.stringify(sidsteFane)); } catch(_){}
}

function render(){
  const nu = katFor(state.tab);
  $('#omraadenavn').textContent = nu.navn;
  document.title = nu.navn + ' · Lisen';
  saetAdresse(nu);
  // Hvert område har sine egne bånd øverst
  $('#stats').hidden = nu.k !== 'vare';
  $('#band').hidden = nu.k !== 'vare';
  $('#flytband').hidden = nu.k !== 'hel';
  $('#butikband').hidden = nu.k !== 'but';
  if (nu.k === 'vare') $('#stats').innerHTML = statsHtml();
  $('#hovednav').innerHTML = KAT.map(k=>{
    const c = katTal(k.k);
    return '<button type="button" data-kat="'+k.k+'" aria-selected="'+(k.k===nu.k)+'">'+esc(k.navn)+
      (c!=null?'<span class="c">'+nf(c)+'</span>':'')+'</button>';
  }).join('');
  const under = $('#undernav');
  under.hidden = nu.faner.length < 2;
  under.innerHTML = nu.faner.map(t=>{
    const c = faneTal(t);
    return '<button role="tab" id="tab-'+t+'" data-tab="'+t+'" aria-selected="'+(t===state.tab)+'">'+
      esc(FANENAVN[t])+(c!=null?'<span class="c">'+nf(c)+'</span>':'')+'</button>';
  }).join('');
  $('#view').innerHTML = ({prio:visPrio, koe:visKoe, retur:visRetur, hels:visHelsinge, allepo:visAllePO, dage:visDage, varer:visVarer, uden:visUden, flyt:visFlyt, butik:visButik, kunhel:visKunHel, butlager:visButikslager, butpop:visPopulaere, genopfyld:visGenopfyld, analyse:visAnalyse}[state.tab] || visPrio)();
}

document.addEventListener('click', e=>{
  const rd = e.target.closest('[data-ret-dato]');
  if (rd){ redigerer = +rd.dataset.retDato; redigerFejl = ''; render(); const i = document.getElementById('ret-dato-'+redigerer); if (i){ i.focus(); try{ i.showPicker && i.showPicker(); }catch(_){} } return; }
  if (e.target.closest('[data-annuller-dato]')){ redigerer = null; redigerFejl = ''; render(); return; }
  const gd = e.target.closest('[data-gem-dato]');
  if (gd){ gemDato(+gd.dataset.gemDato); return; }
  const af = e.target.closest('[data-ap-filter]');
  if (af){ state.apFilter = af.dataset.apFilter; render(); return; }
  const as = e.target.closest('[data-ap-sort]');
  if (as){ const k = as.dataset.apSort; state.apSort = state.apSort.k===k ? {k, dir:-state.apSort.dir} : {k, dir: (k==='lev'||k==='dato'||k==='bestilt')?1:-1}; render(); return; }
  if (e.target.closest('#kh-filter')){ khKunOrdrer = !khKunOrdrer; render(); return; }
  if (e.target.closest('#hel-kun')){ helKun = !helKun; render(); return; }
  if (e.target.closest('#bl-kun')){ blKun = !blKun; render(); return; }
  if (e.target.closest('#gf-kun')){ gfKun = !gfKun; render(); return; }
  const ans = e.target.closest('[data-an-sort]');
  if (ans){ anSort = ans.dataset.anSort; render(); return; }
  if (e.target.closest('#flyt-mere')){ flytAlle = true; render(); return; }
  const fs = e.target.closest('[data-flyt-sort]');
  if (fs){ flytSort = fs.dataset.flytSort; render(); return; }
  if (e.target.closest('#koe-gl')){ koeGl = !koeGl; render(); return; }
  if (e.target.closest('#ret-gl')){ returGl = !returGl; returAlle = false; render(); return; }
  if (e.target.closest('#ret-mere')){ returAlle = true; render(); return; }
  if (e.target.closest('#koe-fold')){ const luk = aabneKoe.size>0; aabneKoe = new Set(luk?[]:KOE_ORDEN);
    try{localStorage.setItem('lv_koe', JSON.stringify([...aabneKoe]))}catch(_){} render(); return; }
  const km = e.target.closest('[data-koe-mere]');
  if (km){ koeAlle.add(km.dataset.koeMere); render(); return; }
  if (e.target.closest('#alle-lok')){ alleLok = !alleLok; if (!alleLok) aabneLok.clear(); render(); return; }
  const s = e.target.closest('[data-span]');
  if (s){ state.span = state.span===s.dataset.span?null:s.dataset.span; if(state.tab!=='prio'&&state.tab!=='varer'){ state.tab='prio'; gemFane(); } render(); return; }
  const fb = e.target.closest('[data-tab-goto]');
  if (fb){ state.tab = fb.dataset.tabGoto; gemFane(); render(); document.querySelector('nav.hoved').scrollIntoView({block:'start',behavior:'smooth'}); return; }
  const kat = e.target.closest('[data-kat]');
  if (kat){ const k = KAT.find(x=>x.k===kat.dataset.kat);
    state.tab = (sidsteFane[k.k] && k.faner.includes(sidsteFane[k.k])) ? sidsteFane[k.k] : k.faner[0];
    gemFane(); render(); return; }
  const t = e.target.closest('nav.tabs button');
  if (t){ state.tab = t.dataset.tab; gemFane(); render(); return; }
  if (e.target.closest('#bare')){ state.bare=!state.bare; render(); return; }
  if (e.target.closest('#rydspan')){ state.span=null; render(); return; }
  const so = e.target.closest('[data-sort]');
  if (so){ const k=so.dataset.sort; state.sort = {k, dir: state.sort.k===k ? -state.sort.dir : (['stk','ordrer','ps_po'].includes(k)?-1:1)}; render(); return; }
  const g = e.target.closest('[data-goto]');
  if (g){ state.tab='prio'; gemFane(); state.span=null; state.q=''; $('#q').value=''; render();
    const el = document.querySelector('details[data-po="'+g.dataset.goto+'"]'); if(el){ el.open=true; el.scrollIntoView({block:'start',behavior:'smooth'}); } }
});
document.addEventListener('keydown', e=>{
  const f = e.target.closest && e.target.closest('[data-po-form]');
  if (!f) return;
  if (e.key === 'Enter'){ e.preventDefault(); gemDato(+f.dataset.poForm); }
  if (e.key === 'Escape'){ redigerer = null; redigerFejl = ''; render(); }
});
let tmr; $('#q').addEventListener('input', e=>{ clearTimeout(tmr); tmr=setTimeout(()=>{ state.q=e.target.value.trim().toLowerCase(); render(); },120); });
render();
}
})();
</script>
