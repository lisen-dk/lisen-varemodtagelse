<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<title>Lisen Varemodtagelse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef0ef; --panel:#ffffff; --panel2:#f6f7f6; --ink:#15191a; --ink2:#4b5456; --ink3:#7b8587;
  --line:#d5dad9; --line2:#e5e9e8;
  --accent:#0f5e6b; --accent-ink:#ffffff; --link:#0d5a8a;
  --tape:#f6c343; --tape-ink:#2a2105;
  --late:#b3261e; --late-bg:#fbe7e5; --today:#0f6b3a; --today-bg:#e0f3e7; --tom:#8a5a00; --tom-bg:#fbf0d6; --later-bg:#eceff0;
  --shadow:0 1px 2px rgba(20,30,30,.06),0 4px 14px rgba(20,30,30,.05);
  --flyt:#6d3fb3; --flyt-bg:#f1ebfa; --butik:#0e7a55; --butik-bg:#e3f4ec;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101415; --panel:#181e1f; --panel2:#1e2527; --ink:#e7ecec; --ink2:#a9b3b4; --ink3:#7d888a;
  --line:#2c3537; --line2:#242c2e; --accent:#5fc0cf; --accent-ink:#06282d; --link:#79b8e6;
  --tape:#e0b23c; --tape-ink:#1f1803;
  --late:#ff8a80; --late-bg:#3a1b19; --today:#6fd39a; --today-bg:#16301f; --tom:#f0c060; --tom-bg:#33290f; --later-bg:#232b2d;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --flyt:#b99af0; --flyt-bg:#2a2140; --butik:#5fd3a2; --butik-bg:#15302a;
}}
:root[data-theme="dark"]{
  --bg:#101415; --panel:#181e1f; --panel2:#1e2527; --ink:#e7ecec; --ink2:#a9b3b4; --ink3:#7d888a;
  --line:#2c3537; --line2:#242c2e; --accent:#5fc0cf; --accent-ink:#06282d; --link:#79b8e6;
  --tape:#e0b23c; --tape-ink:#1f1803;
  --late:#ff8a80; --late-bg:#3a1b19; --today:#6fd39a; --today-bg:#16301f; --tom:#f0c060; --tom-bg:#33290f; --later-bg:#232b2d;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --flyt:#b99af0; --flyt-bg:#2a2140; --butik:#5fd3a2; --butik-bg:#15302a;
}
*{box-sizing:border-box}
html{color-scheme:light dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;margin:0;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
a{color:var(--link)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:28px 18px}
h1{font-stretch:78%;font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1;margin:0;letter-spacing:-.01em;text-transform:uppercase}
h1 small{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--ink3);margin-bottom:6px;font-stretch:100%}
.fresh{font-family:var(--mono);font-size:12px;color:var(--ink2);background:var(--panel);border:1px dashed var(--line);padding:6px 10px;border-radius:4px}
.fresh b{color:var(--tom)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px;position:relative}
.stat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stat .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.stat .lbl i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat .big{font-stretch:80%;font-weight:800;font-size:32px;line-height:1.05}
.stat .sub{font-size:12.5px;color:var(--ink2)}
.stat .sub b{color:var(--ink)}
.s-late .lbl{color:var(--late)} .s-late .lbl i{background:var(--late)}
.s-today .lbl{color:var(--today)} .s-today .lbl i{background:var(--today)}
.s-tom .lbl{color:var(--tom)} .s-tom .lbl i{background:var(--tom)}
.s-later .lbl{color:var(--ink2)} .s-later .lbl i{background:var(--ink3)}

.presell-band{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center;background:var(--tape);color:var(--tape-ink);border-radius:6px;padding:10px 14px;margin-bottom:22px;
  background-image:repeating-linear-gradient(-45deg,transparent 0 14px,rgba(0,0,0,.035) 14px 28px)}
.presell-band div{display:flex;align-items:baseline;gap:6px}
.presell-band b{font-stretch:80%;font-weight:800;font-size:22px}
.presell-band span{font-size:13px}
.presell-band .tag{font-weight:800;letter-spacing:.12em;font-size:12px;text-transform:uppercase}
.flyt-band{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center;width:100%;text-align:left;font:inherit;cursor:pointer;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--flyt);border-radius:6px;padding:10px 14px;margin:-12px 0 22px}
.flyt-band:hover{border-color:var(--flyt)}
.flyt-band div{display:flex;align-items:baseline;gap:6px}
.flyt-band b{font-stretch:80%;font-weight:800;font-size:22px}
.flyt-band span{font-size:13px;color:var(--ink2)}
.flyt-band .tag{font-weight:800;letter-spacing:.12em;font-size:12px;text-transform:uppercase;color:var(--flyt)}
.flyt-band .gaa{margin-left:auto;font-weight:700;font-size:13px;color:var(--link)}
.shop-mark{font-size:.85em;color:var(--ink3)}
.flyt-band.butik-band{border-left-color:var(--butik)}
.flyt-band.butik-band:hover{border-color:var(--butik)}
.flyt-band.butik-band .tag{color:var(--butik)}
.flyt-band + .flyt-band{margin-top:-14px}
.butik-vis .flyt-sum .hoved b,.butik-vis .flytantal b{color:var(--butik)}
.butik-vis .hylde{background:var(--butik-bg)}
.flytantal small{font-size:11.5px;color:var(--ink2);margin-top:4px;white-space:nowrap}
.flyt-sum{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.flyt-sum div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;min-width:150px;flex:1 1 150px}
.flyt-sum b{font-stretch:80%;font-weight:800;font-size:28px;line-height:1.1}
.flyt-sum span{font-size:12.5px;color:var(--ink2)}
.flyt-sum .hoved b{color:var(--flyt)}
.flytliste{display:flex;flex-direction:column;gap:8px}
.flytvare{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px 10px 10px}
.flytvare img,.flytvare .noimg{width:72px;height:72px;object-fit:cover;border-radius:4px;background:var(--panel2);border:1px solid var(--line2);display:block}
.flytvare .noimg{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink3)}
.flytvare h3{margin:0;font-size:15.5px;font-weight:800;font-stretch:90%}
.flytvare h3 small{font-weight:500;color:var(--ink2);font-stretch:100%}
.flytvare .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink2);margin-top:2px}
.hylder{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.hylde{font-family:var(--mono);font-size:11.5px;background:var(--flyt-bg);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:1px 6px;white-space:nowrap}
.flytordrer{font-size:12.5px;margin-top:6px;color:var(--ink2);line-height:1.7;overflow-wrap:anywhere}
.flytordrer a{margin-right:6px;white-space:nowrap}
.flytantal{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.flytantal b{font-stretch:80%;font-weight:800;font-size:26px;line-height:1;color:var(--flyt)}
.flytantal span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
@media (max-width:560px){.flytvare{grid-template-columns:56px minmax(0,1fr)}.flytvare img,.flytvare .noimg{width:56px;height:56px}.flytantal{grid-column:2;flex-direction:row;gap:6px;align-items:baseline}}

nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:14px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:700;font-size:14px;background:none;border:0;padding:9px 14px;color:var(--ink2);cursor:pointer;border-radius:5px 5px 0 0;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button .c{font-family:var(--mono);font-weight:500;font-size:12px;opacity:.75;margin-left:4px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1 1 260px;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink)}
.chip{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink2);padding:6px 10px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:13px;color:var(--ink3);margin:-4px 0 14px}

/* PO-kort */
.polist{display:flex;flex-direction:column;gap:8px}
.po{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.po>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px 12px 0}
.po>summary::-webkit-details-marker{display:none}
.rank{align-self:stretch;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:15px;color:var(--ink3);border-right:1px solid var(--line2)}
.po.har-ordrer .rank{background:var(--tape);color:var(--tape-ink);border-right:0;
  background-image:repeating-linear-gradient(-45deg,transparent 0 8px,rgba(0,0,0,.05) 8px 16px)}
.po-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;min-width:0}
.po-h .lev{font-weight:800;font-size:17px;font-stretch:85%}
.po-h .ref{font-family:var(--mono);font-size:13px;color:var(--ink2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.po-h .id{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.po-note{flex-basis:100%;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.02em;white-space:nowrap}
.b-late{background:var(--late-bg);color:var(--late)} .b-today{background:var(--today-bg);color:var(--today)}
.b-tom{background:var(--tom-bg);color:var(--tom)} .b-later{background:var(--later-bg);color:var(--ink2)}
.b-ps{background:var(--tape);color:var(--tape-ink)}
.b-wait{background:var(--panel2);color:var(--ink3);border:1px solid var(--line)}
.figs{display:flex;gap:18px;text-align:right}
.fig{display:flex;flex-direction:column;min-width:54px}
.fig b{font-stretch:80%;font-weight:800;font-size:22px;line-height:1.1}
.fig span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.fig.ord b{color:var(--late)}
.fig.zero b{color:var(--ink3);font-weight:600}
.po-body{border-top:1px solid var(--line2);padding:14px 16px 16px 70px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px}
.po-body h4{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.po-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;padding:7px 12px;border-radius:5px;font-size:13.5px}
.po-fullnote{grid-column:1/-1;white-space:pre-wrap;font-size:13.5px;background:var(--panel2);border-left:3px solid var(--line);padding:8px 12px;margin:0}
.scroll{overflow-x:auto;max-height:420px;overflow-y:auto;border:1px solid var(--line2);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
td.r,th.r{text-align:right}
tr.vent td{background:color-mix(in srgb,var(--tape) 16%,transparent)}
.sku{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.age{font-family:var(--mono);font-size:12px}
.age.gl{color:var(--late);font-weight:600}
.smalltag{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);margin-left:4px;white-space:nowrap}

/* Ankomster */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.day h3{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px}
.day h3 .n{font-family:var(--mono);font-size:13px;color:var(--ink2);font-weight:500;white-space:nowrap}
.day li button{min-width:0;display:flex;flex-direction:column}
.day li .rf{font-family:var(--mono);font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.day li>span{white-space:nowrap}
.day.late{border-color:var(--late)} .day.today{border-color:var(--today);box-shadow:inset 0 0 0 1px var(--today)}
.day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.day li{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.day li button{font:inherit;background:none;border:0;padding:0;color:var(--link);cursor:pointer;text-align:left}
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .p{background:var(--tape)} .bar .o{background:var(--ink3)}

.varer-tbl th button{font:inherit;background:none;border:0;color:inherit;cursor:pointer;padding:0;letter-spacing:inherit;text-transform:inherit}
.varer-tbl .scroll{max-height:none}
.empty{padding:24px;text-align:center;color:var(--ink3);background:var(--panel);border:1px dashed var(--line);border-radius:6px}
footer{margin-top:28px;font-size:12.5px;color:var(--ink3);max-width:70ch}

@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .po>summary{grid-template-columns:40px minmax(0,1fr);padding-right:12px}
  .figs{grid-column:2;justify-content:flex-start;text-align:left}
  .po-body{grid-template-columns:1fr;padding-left:14px}
  .stat .big{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* Lås */
.laas{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:40px}
.laas form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:26px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.laas h1{font-size:30px}
.laas label{font-size:13px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.laas input[type=password]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);color:var(--ink)}
.laas .husk{flex-direction:row;align-items:center;gap:8px;font-weight:500}
.laas button{font:inherit;font-weight:800;background:var(--ink);color:var(--bg);border:0;border-radius:5px;padding:11px;cursor:pointer}
.laas .fejl{color:var(--late);font-size:13.5px;margin:0}
.laas .tape{height:10px;border-radius:3px;background:var(--tape);background-image:repeating-linear-gradient(-45deg,transparent 0 8px,rgba(0,0,0,.08) 8px 16px)}
.topknap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lille{font:inherit;font-size:12.5px;background:none;border:1px solid var(--line);color:var(--ink2);border-radius:4px;padding:5px 9px;cursor:pointer}
.fresh.gammel{border-color:var(--late);color:var(--late)}
</style>
</head>
<body>
<div class="laas" id="laas" hidden>
  <form id="laasform" autocomplete="on">
    <div class="tape"></div>
    <h1><small>Lisen.dk · lager &amp; kundeservice</small>Varemodtagelse</h1>
    <input type="text" name="username" value="varemodtagelse" autocomplete="username" hidden>
    <label for="kode">Adgangskode
      <input type="password" id="kode" name="password" autocomplete="current-password" required></label>
    <label class="husk" for="husk"><input type="checkbox" id="husk" checked> Husk mig på denne enhed</label>
    <p class="fejl" id="fejl" hidden>Forkert adgangskode. Prøv igen.</p>
    <button type="submit" id="aabn">Åbn</button>
  </form>
</div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <h1><small>Lisen.dk · lager &amp; kundeservice</small>Varemodtagelse</h1>
    <div class="topknap"><div class="fresh" id="fresh"></div><button class="lille" id="logud" type="button">Log ud</button></div>
  </header>

  <section class="stats" id="stats" aria-label="Indkøbsordrer efter forventet levering"></section>
  <section class="presell-band" id="band" aria-label="Presell"></section>
  <button type="button" class="flyt-band" id="flytband" data-tab-goto="flyt" aria-label="Ordrer på flere lagre"></button>
  <button type="button" class="flyt-band butik-band" id="butikband" data-tab-goto="butik" aria-label="Hent i butikken"></button>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-prio" aria-selected="true" data-tab="prio">Prioritet</button>
    <button role="tab" id="tab-dage" aria-selected="false" data-tab="dage">Ankomster</button>
    <button role="tab" id="tab-varer" aria-selected="false" data-tab="varer">Presell-varer</button>
    <button role="tab" id="tab-uden" aria-selected="false" data-tab="uden">Presell uden PO</button>
    <button role="tab" id="tab-flyt" aria-selected="false" data-tab="flyt">Flyt fra Helsinge</button>
    <button role="tab" id="tab-butik" aria-selected="false" data-tab="butik">Hent i butikken</button>
  </nav>

  <div class="tools" id="tools">
    <input type="search" id="q" placeholder="Søg på PO-nummer, leverandør, varenavn, SKU eller ordrenummer" aria-label="Søg">
  </div>
  <div id="view"></div>

  <footer id="foot"></footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
const BLOB = JSON.parse(document.getElementById('data').textContent);
const NOEGLE = 'lv_noegle';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tilB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const hent = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const gem = (k,v) => { try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} };
async function afled(kode){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(kode), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(BLOB.salt), iterations:BLOB.iter}, base, 256);
}
async function dekrypter(raw){
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(BLOB.iv)}, k, b64(BLOB.ct));
  const tekst = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(tekst);
}

const DAGE = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let now = new Date();
const I_DAG = iso(now);
const I_MORGEN = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()+1));
const OM_7 = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()+7));
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const kortDato = s => { const d = pd(s); return d.getDate()+'. '+MDR[d.getMonth()]; };
const dagNavn = s => DAGE[pd(s).getDay()];
const dageSiden = s => Math.floor((now - new Date(s)) / 864e5);
const dageMellem = (a,b) => Math.round((pd(b)-pd(a))/864e5);

function spand(dato){
  if (dato < I_DAG) return 'late';
  if (dato === I_DAG) return 'today';
  if (dato === I_MORGEN) return 'tom';
  return 'later';
}
function datoBadge(dato){
  const s = spand(dato);
  let t;
  if (s==='late'){ const n = dageMellem(dato, I_DAG); t = 'Forsinket '+n+' '+(n===1?'dag':'dage')+' · '+kortDato(dato); }
  else if (s==='today') t = 'I dag';
  else if (s==='tom') t = 'I morgen';
  else t = dagNavn(dato).slice(0,3)+'. '+kortDato(dato);
  return '<span class="badge b-'+s+'">'+esc(t)+'</span>';
}
function alderTxt(t){
  const n = dageSiden(t);
  return '<span class="age'+(n>=7?' gl':'')+'">'+(n<=0?'i dag':n+' d')+'</span>';
}

function visDage(){
  const q = state.q;
  const ps = D.po.filter(p=>!q || p.soeg.includes(q));
  const grupper = new Map();
  const late = ps.filter(p=>p.s==='late');
  if (late.length) grupper.set('late', late);
  ps.filter(p=>p.s!=='late').sort((a,b)=>a.dato<b.dato?-1:1).forEach(p=>{ if(!grupper.has(p.dato)) grupper.set(p.dato,[]); grupper.get(p.dato).push(p); });
  const maks = Math.max(1,...[...grupper.values()].map(g=>g.reduce((a,p)=>a+p.stk,0)));
  if (!grupper.size) return '<div class="empty">Ingen forsendelser matcher.</div>';
  return '<div class="days">'+[...grupper.entries()].map(([k,g])=>{
    const stk = g.reduce((a,p)=>a+p.stk,0), fs = g.reduce((a,p)=>a+p.ps,0), ord = g.reduce((a,p)=>a+p.ordrer.length,0);

    g.sort((a,b)=>(b.ordrer.length-a.ordrer.length)||(b.stk-a.stk));
    return '<div class="day '+(s==='late'?'late':s==='today'?'today':'')+'"><h3><span>'+esc(titel)+'</span><span class="n">'+nf(stk)+' stk</span></h3>'+

      '<div style="font-size:12.5px;color:var(--ink2)">'+g.length+' forsendelser · '+nf(fs)+' presell · '+ord+' ordrer venter</div>'+
      '<ul>'+g.map(p=>'<li><button data-goto="'+p.id+'"><span>'+esc(p.lev)+'</span><span class="rf">PO '+p.id+(k==='late'?' · '+kortDato(p.dato):'')+(p.ref?' · '+esc(p.ref):'')+'</span></button><span class="num">'+(p.ordrer.length?'<span class="badge b-ps">'+p.ordrer.length+' ordr.</span> ':'')+nf(p.stk)+'</span></li>').join('')+'</ul></div>';

}

const B = D.butik || [];
const butikNu = B.reduce((a,v)=>a+v.nu,0), butikSenere = B.reduce((a,v)=>a+v.senere_butik,0);
$('#butikband').innerHTML =
  '<span class="tag">Butik Ramløse</span>'+
  '<div><b class="num">'+nf(butikNu)+'</b><span>stk skal hentes i butikken til webshop-ordrer nu</span></div>'+
  (butikSenere?'<div><b class="num">'+nf(butikSenere)+'</b><span>stk senere (ordren venter på presell)</span></div>':'')+
  '<span class="gaa">Se butikslisten →</span>';

function visButik(){
  const q = state.q;
  const v = B.filter(x=>!q || (x.sku+' '+x.navn+' '+x.farve+' '+x.str+' '+x.hylder.map(h=>h[0]).join(' ')+' '+x.ordrer.map(o=>o.n).join(' ')).toLowerCase().includes(q));
  const ordrerNu = new Set(B.flatMap(x=>x.ordrer.filter(o=>!o.presell).map(o=>o.id))).size;
  const sum = '<div class="flyt-sum">'+
    '<div class="hoved"><b class="num">'+nf(butikNu)+'</b><span>stk skal hentes i butikken nu</span></div>'+
    '<div><b class="num">'+nf(B.filter(x=>x.nu>0).length)+'</b><span>forskellige varer (størrelser)</span></div>'+
    '<div><b class="num">'+nf(ordrerNu)+'</b><span>webshop-ordrer, der kan pakkes, venter på dem</span></div>'+
    '<div><b class="num">'+nf(butikSenere)+'</b><span>stk senere – ordren venter også på presell</span></div></div>';
  const kort = x => {
    const img = x.img ? '<img src="'+esc(x.img)+'" alt="" loading="lazy" referrerpolicy="no-referrer" width="72" height="72">' : '<div class="noimg">intet billede</div>';
    const ord = x.ordrer.map(o=>ordA(o)+(o.q>1?' ('+o.q+' stk)':'')+(o.presell?'<span class="smalltag">venter på presell</span>':'')).join(' ');
    return '<div class="flytvare">'+img+
      '<div><h3>'+esc(x.navn)+(x.farve?' <small>· '+esc(x.farve)+'</small>':'')+'</h3>'+
      '<div class="meta"><span>Str. <b>'+esc(x.str)+'</b></span><span class="sku">'+esc(x.sku)+'</span><span>'+nf(x.butik_stk)+' stk i butikken · '+nf(x.lager_stk)+' på Lager Ramløse · '+nf(x.hel_stk)+' i Helsinge</span><span>Ældste ordre '+alderTxt(x.aeldst)+'</span></div>'+
      '<div class="hylder">'+x.hylder.map(h=>'<span class="hylde" title="'+esc(h[0])+'">'+esc(h[0].replace(/^Hall /,''))+' — '+nf(h[1])+' stk</span>').join('')+'</div>'+
      '<div class="flytordrer">'+x.ordrer.length+(x.ordrer.length===1?' ordre: ':' ordrer: ')+ord+'</div></div>'+
      '<div class="flytantal"><b class="num">'+nf(x.nu)+'</b><span>stk hentes nu</span>'+(x.senere_butik?'<small>+ '+nf(x.senere_butik)+' senere</small>':'')+'</div></div>';
  };
  return '<div class="butik-vis">'+sum+'<p class="hint">Butikken er sidste mulighed: så længe en vare kan plukkes på Lager Ramløse eller Lager Helsinge, tages den der. Listen viser kun det, som de to lagre ikke kan dække, og som derfor skal hentes ud af butikken til webshop-ordrer. Ordrer, der kan pakkes nu, går forud for ordrer, der også venter på presell. Retur, karantæne og totes tæller ikke som lager.</p>'+
    (v.length?'<div class="flytliste">'+v.map(kort).join('')+'</div>':'<div class="empty">'+(B.length?'Ingen varer matcher søgningen.':'Ingen varer skal hentes i butikken lige nu.')+'</div>')+'</div>';
}

function render(){
  $('#stats').innerHTML = statsHtml();
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const t = b.dataset.tab; b.setAttribute('aria-selected', t===state.tab);
    const c = {prio:D.po.length, dage:null, varer:D.varer.length, uden:D.uden_po.length, flyt:F.ordrer.length, butik:B.filter(x=>x.nu>0).length}[t];
    b.innerHTML = b.textContent.replace(/\s*\d+$/,'') + (c!=null?'<span class="c">'+c+'</span>':'');
  });
  $('#view').innerHTML = ({prio:visPrio, dage:visDage, varer:visVarer, uden:visUden, flyt:visFlyt, butik:visButik}[state.tab] || visPrio)();
}

document.addEventListener('click', e=>{
  const s = e.target.closest('[data-span]');
  if (s){ state.span = state.span===s.dataset.span?null:s.dataset.span; if(state.tab!=='prio'&&state.tab!=='varer') state.tab='prio'; render(); return; }
  const fb = e.target.closest('[data-tab-goto]');
  if (fb){ state.tab = fb.dataset.tabGoto; try{localStorage.setItem('lv_tab',state.tab)}catch(_){} render(); document.querySelector('nav.tabs').scrollIntoView({block:'start',behavior:'smooth'}); return; }
  const t = e.target.closest('nav.tabs button');
  if (t){ state.tab = t.dataset.tab; try{localStorage.setItem('lv_tab',state.tab)}catch(_){} render(); return; }
  if (e.target.closest('#bare')){ state.bare=!state.bare; render(); return; }
  if (e.target.closest('#rydspan')){ state.span=null; render(); return; }
  const so = e.target.closest('[data-sort]');
  if (so){ const k=so.dataset.sort; state.sort = {k, dir: state.sort.k===k ? -state.sort.dir : (['stk','ordrer','ps_po'].includes(k)?-1:1)}; render(); return; }
  const g = e.target.closest('[data-goto]');
  if (g){ state.tab='prio'; state.span=null; state.q=''; $('#q').value=''; render();
    const el = document.querySelector('details[data-po="'+g.dataset.goto+'"]'); if(el){ el.open=true; el.scrollIntoView({block:'start',behavior:'smooth'}); } }
});
let tmr; $('#q').addEventListener('input', e=>{ clearTimeout(tmr); tmr=setTimeout(()=>{ state.q=e.target.value.trim().toLowerCase(); render(); },120); });
render();
}
})();
</script>
</body>
</html>
