name: Varemodtagelse

on:
  workflow_dispatch:
  repository_dispatch:
    types: [smartpack]            # sendes af Cloudflare-Workeren, når SmartPack melder ændringer
  schedule:
    - cron: "*/30 4-20 * * *"     # sikkerhedsnet: hver halve time ca. kl. 06-22 dansk sommertid

permissions:
  contents: read
  pages: write
  id-token: write

# Højst én kørsel ad gangen + én i kø. Kommer der flere ændringer, mens en kørsel er i gang,
# samles de i den ene kørsel, der står i kø.
concurrency:
  group: varemodtagelse
  cancel-in-progress: false

jobs:
  byg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Installer kryptering
        run: pip install --quiet cryptography

      - name: Hent tal og byg siden
        env:
          SMARTPACK_APP_ID: ${{ secrets.SMARTPACK_APP_ID }}
          SMARTPACK_TOKEN: ${{ secrets.SMARTPACK_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python3 build.py

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  udgiv:
    needs: byg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
