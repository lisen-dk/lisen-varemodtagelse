name: Varemodtagelse

on:
  workflow_dispatch:
  repository_dispatch:
    types: [smartpack]            # sendes af Cloudflare-Workeren, når SmartPack melder ændringer
  schedule:
    - cron: "23 4-18 * * *"       # sikkerhedsnet: hver time ca. kl. 06-20 dansk tid

permissions:
  contents: read
  pages: write
  id-token: write

# Højst én kørsel ad gangen. En ny kørsel afbryder den igangværende: den bygger alligevel
# de samme tal forfra, og så kan en kørsel, der hænger fast (fx i udgivelsen), ikke
# blokere køen i timevis.
concurrency:
  group: varemodtagelse
  cancel-in-progress: true

jobs:
  byg:
    runs-on: ubuntu-latest
    # SmartPack er mærkbart langsommere i åbningstiden; en ny kørsel afbryder alligevel
    # en, der trækker ud, så der er plads til en langsom morgen.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5

      - name: Installer kryptering
        run: pip install --quiet cryptography

      # Salget de sidste 14 dage tælles op lidt ad gangen og genbruges mellem kørslerne
      - name: Hent tidligere salgstal
        uses: actions/cache/restore@v4
        with:
          path: state
          key: salg-${{ github.run_id }}
          restore-keys: salg-

      - name: Hent tal og byg siden
        env:
          SMARTPACK_APP_ID: ${{ secrets.SMARTPACK_APP_ID }}
          SMARTPACK_TOKEN: ${{ secrets.SMARTPACK_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          # Kun til packshot-billederne (custom.packshot_url). Mangler de, springes det over.
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python3 build.py

      - name: Gem salgstal
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state
          key: salg-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  udgiv:
    needs: byg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
